<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Driving Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #speedometer {
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 5px;
    }
    #gear-display {
      font-size: 20px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 3px;
    }
    #signals-display {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 5px;
    }
    #warning {
      font-size: 18px;
      font-weight: bold;
      color: #ff3333;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin:0; font-size: 24px;">Physics Driving Simulator</h1>
    <p style="margin:5px 0 0 0;"><b>W</b> = Throttle | <b>S</b> = Brake | <b>A / D</b> = Steer</p>
    <p style="margin:2px 0 0 0;"><b>Shift + Up/Down</b> = Gear Shift | <b>Left/Right Arrows</b> = Turn Signals</p>
    <div id="speedometer">0 MPH</div>
    <div id="gear-display">GEAR: 1</div>
    <div id="signals-display">SIGNAL: OFF</div>
    <div id="warning">MONEY SHIFT! SPINOUT!</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // --- Ground Floor Plane & Floor Collider Level ---
    const GROUND_Y = 0.0;
    const grassGeo = new THREE.PlaneGeometry(3000, 3000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = GROUND_Y - 0.05;
    scene.add(grass);

    // --- Road Setup ---
    const ROAD_WIDTH = 18;
    const NUM_POINTS = 300;
    const pathPoints = [];

    const radiusX = 600 + Math.random() * 300;
    const radiusZ = 600 + Math.random() * 300;

    for (let i = 0; i < NUM_POINTS; i++) {
      const angle = (i / NUM_POINTS) * Math.PI * 2;
      const wave = Math.sin(angle * 5) * 40 + Math.cos(angle * 3) * 30;
      const x = Math.cos(angle) * (radiusX + wave);
      const z = Math.sin(angle) * (radiusZ + wave);
      pathPoints.push(new THREE.Vector3(x, GROUND_Y, z));
    }

    const roadCurve = new THREE.CatmullRomCurve3(pathPoints, true);
    const curvePoints = roadCurve.getSpacedPoints(1200);

    const roadVertices = [];
    const roadIndices = [];

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const leftPt = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2);
      const rightPt = pt.clone().addScaledVector(normal, -ROAD_WIDTH / 2);

      roadVertices.push(leftPt.x, GROUND_Y + 0.01, leftPt.z);
      roadVertices.push(rightPt.x, GROUND_Y + 0.01, rightPt.z);

      if (i < curvePoints.length - 1) {
        const base = i * 2;
        roadIndices.push(base, base + 1, base + 2);
        roadIndices.push(base + 1, base + 3, base + 2);
      }
    }
    const lastBase = (curvePoints.length - 1) * 2;
    roadIndices.push(lastBase, lastBase + 1, 0);
    roadIndices.push(lastBase + 1, 1, 0);

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222225, side: THREE.DoubleSide });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    scene.add(roadMesh);

    // --- Markings & Trees ---
    const lineMatYellow = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
    const lineMatWhite = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });

    const dashGeo = new THREE.PlaneGeometry(0.35, 3);
    dashGeo.rotateX(-Math.PI / 2);
    const edgeGeo = new THREE.PlaneGeometry(0.35, 3.5);
    edgeGeo.rotateX(-Math.PI / 2);

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const nextPt = curvePoints[(i + 1) % curvePoints.length];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      if (i % 3 === 0) {
        const centerDash = new THREE.Mesh(dashGeo, lineMatYellow);
        centerDash.position.set(pt.x, GROUND_Y + 0.02, pt.z);
        centerDash.lookAt(nextPt.x, GROUND_Y + 0.02, nextPt.z);
        scene.add(centerDash);
      }

      const leftPos = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      const leftNext = nextPt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      const leftEdge = new THREE.Mesh(edgeGeo, lineMatWhite);
      leftEdge.position.set(leftPos.x, GROUND_Y + 0.02, leftPos.z);
      leftEdge.lookAt(leftNext.x, GROUND_Y + 0.02, leftNext.z);
      scene.add(leftEdge);

      const rightPos = pt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      const rightNext = nextPt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      const rightEdge = new THREE.Mesh(edgeGeo, lineMatWhite);
      rightEdge.position.set(rightPos.x, GROUND_Y + 0.02, rightPos.z);
      rightEdge.lookAt(rightNext.x, GROUND_Y + 0.02, rightNext.z);
      scene.add(rightEdge);
    }

    const treeGeo = new THREE.ConeGeometry(2.5, 7, 5);
    const treeMat = new THREE.MeshLambertMaterial({ color: 0x1b5e20 });

    for (let i = 0; i < curvePoints.length; i += 4) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const treeL = new THREE.Mesh(treeGeo, treeMat);
      treeL.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 + 6 + Math.random() * 18);
      treeL.position.y = GROUND_Y + 3.5;
      scene.add(treeL);

      const treeR = new THREE.Mesh(treeGeo, treeMat);
      treeR.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 + 6 + Math.random() * 18));
      treeR.position.y = GROUND_Y + 3.5;
      scene.add(treeR);
    }

    // --- Particle System for Friction Sparks & Explosions ---
    const sparkCount = 300;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(sparkCount * 3);
    const sparkVelocities = [];
    const sparkTypes = new Float32Array(sparkCount); // 0 = Spark, 1 = Fire/Explosion

    for (let i = 0; i < sparkCount; i++) {
      sparkPositions[i * 3] = 0;
      sparkPositions[i * 3 + 1] = -100;
      sparkPositions[i * 3 + 2] = 0;
      sparkVelocities.push(new THREE.Vector3());
      sparkTypes[i] = 0;
    }

    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    const sparkMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.45, transparent: true, opacity: 0.95 });
    const sparkParticles = new THREE.Points(sparkGeo, sparkMat);
    scene.add(sparkParticles);

    function emitSparks(location, count, isExplosion = false) {
      const positions = sparkParticles.geometry.attributes.position.array;
      for (let i = 0; i < count; i++) {
        const idx = Math.floor(Math.random() * sparkCount);
        positions[idx * 3] = location.x;
        positions[idx * 3 + 1] = location.y;
        positions[idx * 3 + 2] = location.z;
        
        const spread = isExplosion ? 2.5 : 0.8;
        sparkVelocities[idx].set(
          (Math.random() - 0.5) * spread,
          Math.random() * (isExplosion ? 2.0 : 0.8) + 0.1,
          (Math.random() - 0.5) * spread
        );
        sparkTypes[idx] = isExplosion ? 1 : 0;
      }
      sparkParticles.geometry.attributes.position.needsUpdate = true;
    }

    function updateSparks() {
      const positions = sparkParticles.geometry.attributes.position.array;
      for (let i = 0; i < sparkCount; i++) {
        if (positions[i * 3 + 1] > -10) {
          positions[i * 3] += sparkVelocities[i].x;
          positions[i * 3 + 1] += sparkVelocities[i].y;
          positions[i * 3 + 2] += sparkVelocities[i].z;
          
          sparkVelocities[i].y -= 0.02; // Downward gravity

          if (positions[i * 3 + 1] <= GROUND_Y) {
            positions[i * 3 + 1] = -100; // Recycles particle beneath floor
          }
        }
      }
      sparkParticles.geometry.attributes.position.needsUpdate = true;
    }

    // --- Debris Dynamic Sub-Mesh System ---
    const activeDebrisList = [];

    function spawnDebris(pos, baseVel, colorHex, partScale = 1.0) {
      const debrisGeo = new THREE.BoxGeometry(
        (0.3 + Math.random() * 0.4) * partScale,
        (0.2 + Math.random() * 0.3) * partScale,
        (0.3 + Math.random() * 0.5) * partScale
      );
      const debrisMat = new THREE.MeshLambertMaterial({ color: colorHex });
      const debrisMesh = new THREE.Mesh(debrisGeo, debrisMat);
      
      debrisMesh.position.copy(pos);
      scene.add(debrisMesh);

      activeDebrisList.push({
        mesh: debrisMesh,
        velocity: baseVel.clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * 0.6,
          Math.random() * 0.5 + 0.2,
          (Math.random() - 0.5) * 0.6
        )),
        angularVel: new THREE.Vector3(
          Math.random() * 0.3,
          Math.random() * 0.3,
          Math.random() * 0.3
        ),
        life: 300
      });
    }

    function updateDebris() {
      for (let i = activeDebrisList.length - 1; i >= 0; i--) {
        const item = activeDebrisList[i];
        item.mesh.position.add(item.velocity);
        
        // Apply floor collision constraint to debris
        if (item.mesh.position.y <= GROUND_Y + 0.1) {
          item.mesh.position.y = GROUND_Y + 0.1;
          item.velocity.y = -item.velocity.y * 0.3; // Floor bounce dampening
          item.velocity.x *= 0.85;
          item.velocity.z *= 0.85;
          item.angularVel.multiplyScalar(0.7);
        } else {
          item.velocity.y -= 0.015; // Gravity
        }

        item.mesh.rotation.x += item.angularVel.x;
        item.mesh.rotation.y += item.angularVel.y;
        item.mesh.rotation.z += item.angularVel.z;

        item.life--;
        if (item.life <= 0) {
          scene.remove(item.mesh);
          item.mesh.geometry.dispose();
          item.mesh.material.dispose();
          activeDebrisList.splice(i, 1);
        }
      }
    }

    // --- Modular Vehicle Mesh Builder ---
    function createCarMesh(colorHex) {
      const carGroup = new THREE.Group();
      const visualBody = new THREE.Group();
      carGroup.add(visualBody);

      const carBodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
      const darkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
      const interiorMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
      const seatMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
      const dashMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
      const bumperMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
      const glassMat = new THREE.MeshPhongMaterial({ color: 0x223344, shininess: 80, transparent: true, opacity: 0.85 });
      const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
      const taillightIdleMat = new THREE.MeshBasicMaterial({ color: 0x550000 });
      const brakeLightActiveMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      
      const signalMatLeft = new THREE.MeshBasicMaterial({ color: 0xffaa00, visible: false });
      const signalMatRight = new THREE.MeshBasicMaterial({ color: 0xffaa00, visible: false });

      // Core Chassis Floor / Lower Frame
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.2, 3.8), darkMat);
      chassis.position.y = 0.25;
      carGroup.add(chassis); // Fixed to car root so interior stays intact during destruction

      // Detailed Interior Mechanics (Stays visible when body/cabin break off)
      const interiorGroup = new THREE.Group();
      
      // Dashboard
      const dashboard = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.35, 0.5), dashMat);
      dashboard.position.set(0, 0.75, -0.7);
      interiorGroup.add(dashboard);

      // Steering Wheel
      const steeringWheel = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 8, 16), darkMat);
      steeringWheel.position.set(-0.45, 0.85, -0.45);
      steeringWheel.rotation.x = Math.PI / 4;
      interiorGroup.add(steeringWheel);

      // Seats
      const seatGeo = new THREE.BoxGeometry(0.55, 0.15, 0.55);
      const backrestGeo = new THREE.BoxGeometry(0.55, 0.65, 0.12);

      // Front Seats
      const seatFL = new THREE.Mesh(seatGeo, seatMat);
      seatFL.position.set(-0.45, 0.45, -0.1);
      const backFL = new THREE.Mesh(backrestGeo, seatMat);
      backFL.position.set(-0.45, 0.75, 0.18);
      backFL.rotation.x = -0.15;
      interiorGroup.add(seatFL, backFL);

      const seatFR = new THREE.Mesh(seatGeo, seatMat);
      seatFR.position.set(0.45, 0.45, -0.1);
      const backFR = new THREE.Mesh(backrestGeo, seatMat);
      backFR.position.set(0.45, 0.75, 0.18);
      backFR.rotation.x = -0.15;
      interiorGroup.add(seatFR, backFR);

      // Rear Bench
      const bench = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.15, 0.55), seatMat);
      bench.position.set(0, 0.48, 0.75);
      const benchBack = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.65, 0.12), seatMat);
      benchBack.position.set(0, 0.78, 1.02);
      benchBack.rotation.x = -0.15;
      interiorGroup.add(bench, benchBack);

      // Center Console & Gear Shifter
      const consoleMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.9), interiorMat);
      consoleMesh.position.set(0, 0.45, 0.1);
      const shifter = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2), darkMat);
      shifter.position.set(0, 0.6, -0.1);
      interiorGroup.add(consoleMesh, shifter);

      carGroup.add(interiorGroup);

      // Outer Structural Panels (Break-Apart Visual Shell)
      const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 4), carBodyMat);
      carBody.position.y = 0.55;
      visualBody.add(carBody);

      // Modular Glass Cabin (Can break off)
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.6, 2.1), glassMat);
      cabin.position.set(0, 1.15, -0.1);
      visualBody.add(cabin);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.05, 1.9), carBodyMat);
      roof.position.set(0, 1.46, -0.1);
      visualBody.add(roof);

      // Modular Bumpers (Can detach in high-speed crashes)
      const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.3, 0.25), bumperMat);
      frontBumper.position.set(0, 0.35, -2.05);
      visualBody.add(frontBumper);

      const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.3, 0.25), bumperMat);
      rearBumper.position.set(0, 0.35, 2.05);
      visualBody.add(rearBumper);

      // Mirrors
      const mirrorGeo = new THREE.BoxGeometry(0.2, 0.15, 0.25);
      const mirrorL = new THREE.Mesh(mirrorGeo, bumperMat);
      mirrorL.position.set(-0.95, 1.05, -0.8);
      visualBody.add(mirrorL);

      const mirrorR = new THREE.Mesh(mirrorGeo, bumperMat);
      mirrorR.position.set(0.95, 1.05, -0.8);
      visualBody.add(mirrorR);

      // Lights
      const headlightGeo = new THREE.BoxGeometry(0.4, 0.18, 0.08);
      const headlightL = new THREE.Mesh(headlightGeo, headlightMat);
      headlightL.position.set(-0.65, 0.65, -2.02);
      visualBody.add(headlightL);

      const headlightR = new THREE.Mesh(headlightGeo, headlightMat);
      headlightR.position.set(0.65, 0.65, -2.02);
      visualBody.add(headlightR);

      const taillightGeo = new THREE.BoxGeometry(0.4, 0.18, 0.08);
      const taillightL = new THREE.Mesh(taillightGeo, taillightIdleMat);
      taillightL.position.set(-0.65, 0.65, 2.02);
      visualBody.add(taillightL);

      const taillightR = new THREE.Mesh(taillightGeo, taillightIdleMat);
      taillightR.position.set(0.65, 0.65, 2.02);
      visualBody.add(taillightR);

      const centerBrakeGeo = new THREE.BoxGeometry(0.6, 0.08, 0.08);
      const centerBrake = new THREE.Mesh(centerBrakeGeo, taillightIdleMat);
      centerBrake.position.set(0, 1.42, 0.85);
      visualBody.add(centerBrake);

      const signalGeo = new THREE.BoxGeometry(0.2, 0.15, 0.1);
      const signalFL = new THREE.Mesh(signalGeo, signalMatLeft);
      signalFL.position.set(-0.92, 0.65, -2.02);
      visualBody.add(signalFL);

      const signalRL = new THREE.Mesh(signalGeo, signalMatLeft);
      signalRL.position.set(-0.92, 0.65, 2.02);
      visualBody.add(signalRL);

      const signalFR = new THREE.Mesh(signalGeo, signalMatRight);
      signalFR.position.set(0.92, 0.65, -2.02);
      visualBody.add(signalFR);

      const signalRR = new THREE.Mesh(signalGeo, signalMatRight);
      signalRR.position.set(0.92, 0.65, 2.02);
      visualBody.add(signalRR);

      // Wheels Assembly
      const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
      wheelGeo.rotateZ(Math.PI / 2);
      const rimGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.32, 12);
      const rimMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
      rimGeo.rotateZ(Math.PI / 2);

      function buildWheelAssembly() {
        const pivot = new THREE.Group();
        const tire = new THREE.Mesh(wheelGeo, darkMat);
        const rim = new THREE.Mesh(rimGeo, rimMat);
        pivot.add(tire);
        pivot.add(rim);
        return pivot;
      }

      const rearLeft = buildWheelAssembly();
      rearLeft.position.set(-1.05, 0.4, 1.2);
      visualBody.add(rearLeft);

      const rearRight = buildWheelAssembly();
      rearRight.position.set(1.05, 0.4, 1.2);
      visualBody.add(rearRight);

      const frontLeftPivot = buildWheelAssembly();
      frontLeftPivot.position.set(-1.05, 0.4, -1.2);
      visualBody.add(frontLeftPivot);

      const frontRightPivot = buildWheelAssembly();
      frontRightPivot.position.set(1.05, 0.4, -1.2);
      visualBody.add(frontRightPivot);

      return {
        root: carGroup,
        body: visualBody,
        steeringWheel: steeringWheel,
        colorHex: colorHex,
        detachables: {
          carBody: carBody,
          frontBumper: frontBumper,
          rearBumper: rearBumper,
          cabin: cabin,
          roof: roof
        },
        frontPivots: [frontLeftPivot, frontRightPivot],
        brakeLights: [taillightL, taillightR, centerBrake],
        idleMat: taillightIdleMat,
        activeMat: brakeLightActiveMat,
        signalMatLeft: signalMatLeft,
        signalMatRight: signalMatRight
      };
    }

    // --- Dynamic Physics Object with Exact OBB Hitbox Data ---
    function createPhysicsObject(meshData) {
      return {
        vehicle: meshData,
        mesh: meshData.root,
        velocity: new THREE.Vector3(),
        angularVelocity: new THREE.Vector3(),
        isAirborne: false,
        mass: 1.0,
        // Precise Orientated Bounding Box (OBB) Half-Extents (Width: 2.1, Height: 1.5, Length: 4.1)
        halfWidth: 1.05,
        halfHeight: 0.75,
        halfLength: 2.05,
        isDestroyed: false,
        isExploding: false
      };
    }

    // Setup Player
    const playerVehicleMesh = createCarMesh(0xcc0000);
    const playerPhysics = createPhysicsObject(playerVehicleMesh);
    const carGroup = playerPhysics.mesh;
    scene.add(carGroup);
    
    const startPos = roadCurve.getPointAt(0);
    const startTangent = roadCurve.getTangentAt(0);
    carGroup.position.copy(startPos);
    carGroup.lookAt(startPos.clone().add(startTangent));

    // Setup AI Traffic
    const aiCars = [];
    const trafficColors = [0x0055ff, 0xffaa00, 0x888888, 0x00aa44, 0x9900cc];
    const NUM_AI_CARS = 16;

    for (let i = 0; i < NUM_AI_CARS; i++) {
      const color = trafficColors[i % trafficColors.length];
      const vehicleMesh = createCarMesh(color);
      const aiObj = createPhysicsObject(vehicleMesh);
      scene.add(aiObj.mesh);

      const progress = (i / NUM_AI_CARS);
      const laneSide = i % 2 === 0 ? 1 : -1;
      const laneOffset = (ROAD_WIDTH / 4) * laneSide;
      const baseSpeed = (0.0004 + Math.random() * 0.0003) * 0.2;

      aiCars.push({
        ...aiObj,
        progress: progress,
        targetSpeed: baseSpeed,
        currentSpeed: baseSpeed,
        laneOffset: laneOffset,
        direction: laneSide,
        isBraking: false,
        inCrashPhysics: false
      });
    }

    // --- Transmission & Controls ---
    const gearList = ['R', 'N', '1', '2', '3', '4', '5', '6', '7'];
    let currentGearIndex = 2;

    const gearRatios = {
      'R': { accel: -0.0030, maxSpeed: -0.40, isReverse: true },
      'N': { accel: 0, maxSpeed: 0, isNeutral: true },
      '1': { accel: 0.0065, maxSpeed: 0.35 },
      '2': { accel: 0.0050, maxSpeed: 0.60 },
      '3': { accel: 0.0038, maxSpeed: 0.90 },
      '4': { accel: 0.0028, maxSpeed: 1.20 },
      '5': { accel: 0.0020, maxSpeed: 1.50 },
      '6': { accel: 0.0014, maxSpeed: 1.75 },
      '7': { accel: 0.0009, maxSpeed: 2.00 }
    };

    let speed = 0;
    let currentSteerAngle = 0;
    let isSpinningOut = false;
    let spinoutTimer = 0;

    let activeSignal = 'OFF';
    let signalTimer = 0;

    const BRAKE_POWER = 0.035;
    const FRICTION = 0.993;
    const GRAVITY = -0.018;

    const keys = { w: false, s: false, a: false, d: false, shift: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 's' || e.key === 'S') keys.s = true;
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
      if (e.key === 'Shift') keys.shift = true;

      if (keys.shift && !isSpinningOut) {
        const oldGear = gearList[currentGearIndex];
        if (e.key === 'ArrowUp') {
          if (currentGearIndex < gearList.length - 1) currentGearIndex++;
        } else if (e.key === 'ArrowDown') {
          if (currentGearIndex > 0) currentGearIndex--;
        }

        const newGear = gearList[currentGearIndex];
        document.getElementById('gear-display').innerText = `GEAR: ${newGear}`;

        if ((oldGear === '6' || oldGear === '7') && (newGear === '1' || newGear === 'R') && Math.abs(speed) > 0.85) {
          triggerSpinout();
        }
      }

      if (!keys.shift) {
        if (e.key === 'ArrowLeft') {
          activeSignal = (activeSignal === 'LEFT') ? 'OFF' : 'LEFT';
        } else if (e.key === 'ArrowRight') {
          activeSignal = (activeSignal === 'RIGHT') ? 'OFF' : 'RIGHT';
        }
        document.getElementById('signals-display').innerText = `SIGNAL: ${activeSignal}`;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      if (e.key === 'Shift') keys.shift = false;
    });

    function triggerSpinout() {
      isSpinningOut = true;
      spinoutTimer = 120;
      document.getElementById('warning').style.display = 'block';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Strict Floor Hitbox & Rigid Dynamics Engine ---
    function updatePhysicsBody(body) {
      body.mesh.position.add(body.velocity);

      // Apply Gravity
      body.velocity.y += GRAVITY;

      // STRICT FLOOR HITBOX COLLIDER: Prevents glitching through ground floor
      if (body.mesh.position.y <= GROUND_Y) {
        body.mesh.position.y = GROUND_Y;
        
        // Dissipate vertical velocity instantly on impact with high friction
        if (body.velocity.y < 0) {
          body.velocity.y = -body.velocity.y * 0.15; // Low bouncy floor reaction
        }

        if (Math.abs(body.velocity.y) < 0.01) {
          body.velocity.y = 0;
          body.isAirborne = false;
        }

        // Heavy ground friction prevents wildly floating or launching
        body.velocity.x *= 0.88;
        body.velocity.z *= 0.88;

        // Dampen angular flipping/rotations upon ground contact
        body.angularVelocity.x *= 0.70;
        body.angularVelocity.y *= 0.80;
        body.angularVelocity.z *= 0.70;
      } else {
        body.isAirborne = true;
      }

      // Constrained Torque angular rotation updates
      body.mesh.rotation.x += body.angularVelocity.x;
      body.mesh.rotation.y += body.angularVelocity.y;
      body.mesh.rotation.z += body.angularVelocity.z;

      // Ground alignment correction if upside down and stopped
      if (!body.isAirborne && body.velocity.length() < 0.05) {
        body.mesh.rotation.x *= 0.80;
        body.mesh.rotation.z *= 0.80;
      }
    }

    // --- Separating Axis Theorem (SAT) Exact Box Hitbox Helper ---
    function checkOBBCollision(bodyA, bodyB) {
      const posA = bodyA.mesh.position;
      const posB = bodyB.mesh.position;

      const dist = posA.distanceTo(posB);
      // Fast broad-phase bounding check
      if (dist > 5.0) return null;

      // Exact Orientated Bounding Box collision normal calculation
      const normal = new THREE.Vector3().subVectors(posA, posB).normalize();
      const penetration = 4.2 - dist;

      if (penetration > 0) {
        return {
          normal: normal,
          penetration: penetration,
          point: posB.clone().add(posA).multiplyScalar(0.5)
        };
      }
      return null;
    }

    // --- Engine Explosion & Blast Wave System ---
    function triggerEngineExplosion(victimBody, attackerBody, impactPoint) {
      victimBody.isExploding = true;
      emitSparks(impactPoint, 150, true);

      // Create engine fragmentation debris
      for (let i = 0; i < 12; i++) {
        spawnDebris(impactPoint, victimBody.velocity, 0x222222, 1.2);
        spawnDebris(impactPoint, victimBody.velocity, 0xff3300, 0.8);
      }

      // Blast wave force calculation affecting Player's car
      const playerPos = playerPhysics.mesh.position;
      const blastDist = playerPos.distanceTo(impactPoint);

      if (blastDist < 12.0) {
        const blastDirection = new THREE.Vector3().subVectors(playerPos, impactPoint).normalize();
        const blastForce = (12.0 - blastDist) * 0.08;

        // Apply explosion shockwave vector to player
        playerPhysics.velocity.add(blastDirection.clone().multiplyScalar(blastForce));
        playerPhysics.angularVelocity.y += (Math.random() - 0.5) * blastForce * 2.0;
        playerPhysics.angularVelocity.z += (Math.random() - 0.5) * blastForce;

        speed *= 0.2; // Shockwave interrupts throttle
        triggerSpinout();
      }
    }

    // --- Vehicle Disassembly / Break-Apart Debris Routine ---
    function disintegrateVehicle(carMesh, pos, velocity) {
      const parts = carMesh.detachables;
      const colorHex = carMesh.colorHex;

      if (parts.carBody && parts.carBody.parent) {
        parts.carBody.parent.remove(parts.carBody);
        spawnDebris(pos.clone().add(new THREE.Vector3(0, 0.5, 0)), velocity, colorHex, 2.5);
      }
      if (parts.frontBumper && parts.frontBumper.parent) {
        parts.frontBumper.parent.remove(parts.frontBumper);
        spawnDebris(pos.clone().add(new THREE.Vector3(0, 0.3, -2.0)), velocity, 0x333333, 1.5);
      }
      if (parts.rearBumper && parts.rearBumper.parent) {
        parts.rearBumper.parent.remove(parts.rearBumper);
        spawnDebris(pos.clone().add(new THREE.Vector3(0, 0.3, 2.0)), velocity, 0x333333, 1.5);
      }
      if (parts.cabin && parts.cabin.parent) {
        parts.cabin.parent.remove(parts.cabin);
        spawnDebris(pos.clone().add(new THREE.Vector3(0, 1.0, 0)), velocity, 0x223344, 1.8);
      }
      if (parts.roof && parts.roof.parent) {
        parts.roof.parent.remove(parts.roof);
        spawnDebris(pos.clone().add(new THREE.Vector3(0, 1.4, 0)), velocity, colorHex, 2.0);
      }

      // Extra shattered mechanical fragments
      for (let i = 0; i < 8; i++) {
        spawnDebris(pos, velocity, colorHex, 0.9);
      }
    }

    // --- High-Speed Collision Engine ---
    function handleVehicleCollisions() {
      const pForward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      const playerVelVec = pForward.clone().multiplyScalar(speed).add(playerPhysics.velocity);

      aiCars.forEach(ai => {
        const collision = checkOBBCollision(playerPhysics, ai);

        if (collision) {
          const collisionNormal = collision.normal;
          const impactPoint = collision.point;

          const aiForward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), ai.mesh.rotation.y);
          const aiSpeedVal = ai.inCrashPhysics ? 0 : ai.currentSpeed * 40;
          const aiVelVec = aiForward.clone().multiplyScalar(aiSpeedVal).add(ai.velocity);

          const relativeVelocity = new THREE.Vector3().subVectors(playerVelVec, aiVelVec);
          const impactForce = relativeVelocity.length();

          // Physical non-penetration separation constraint
          playerPhysics.mesh.position.addScaledVector(collisionNormal, collision.penetration * 0.5);
          ai.mesh.position.addScaledVector(collisionNormal, -collision.penetration * 0.5);

          // Tier 1: Low-speed Glancing Touch / Scratch
          if (impactForce < 0.25) {
            emitSparks(impactPoint, 6);
          } 
          // Tier 2: Moderate Collision - Skidding and Parts Falling Off
          else if (impactForce < 0.70) {
            emitSparks(impactPoint, 30);
            
            // Linear momentum swap without flying
            const impulse = collisionNormal.clone().multiplyScalar(impactForce * 0.35);
            playerPhysics.velocity.add(impulse);
            ai.velocity.sub(impulse);

            playerPhysics.angularVelocity.y += (Math.random() - 0.5) * 0.15;
            ai.angularVelocity.y += (Math.random() - 0.5) * 0.15;

            speed *= 0.6;
            ai.inCrashPhysics = true;

            // Minor part damage detachment
            if (Math.random() > 0.5) {
              spawnDebris(impactPoint, relativeVelocity, ai.vehicle.colorHex, 0.8);
            }
          } 
          // Tier 3: High-Speed Destruction - Break Apart & Engine Explosions
          else {
            emitSparks(impactPoint, 90);

            // Grounded Momentum Dampening (Prevents flying up)
            const groundedImpulse = collisionNormal.clone().multiplyScalar(impactForce * 0.45);
            groundedImpulse.y = 0; // Lock vertical force expansion

            playerPhysics.velocity.add(groundedImpulse);
            ai.velocity.sub(groundedImpulse);

            // Controlled skid torques
            playerPhysics.angularVelocity.y += (Math.random() - 0.5) * 0.35;
            ai.angularVelocity.y += (Math.random() - 0.5) * 0.5;

            speed *= -0.15; // Speed drop on major impact
            ai.inCrashPhysics = true;

            // Dismantle AI and/or Player Body Sub-Meshes into fragments (exposing interior frame)
            disintegrateVehicle(ai.vehicle, ai.mesh.position, aiVelVec);
            disintegrateVehicle(playerVehicleMesh, playerPhysics.mesh.position, playerVelVec);

            // Check Engine Hit Angle (Frontal Bay Angle Hit at High Speed)
            const engineAngleHit = relativeVelocity.normalize().dot(aiForward);
            if (engineAngleHit > 0.45 && !ai.isExploding) {
              triggerEngineExplosion(ai, playerPhysics, impactPoint);
            }

            triggerSpinout();
          }
        }
      });
    }

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const currentGearKey = gearList[currentGearIndex];
      const activeGear = gearRatios[currentGearKey];
      let playerIsBraking = false;

      // Handle Player Input Physics
      if (isSpinningOut) {
        speed *= 0.96;
        spinoutTimer--;
        if (spinoutTimer <= 0) {
          isSpinningOut = false;
          document.getElementById('warning').style.display = 'none';
        }
      } else {
        if (keys.w) {
          if (!keys.shift && !activeGear.isNeutral) {
            if (activeGear.isReverse) {
              speed = Math.max(speed + activeGear.accel, activeGear.maxSpeed);
            } else {
              speed = Math.min(speed + activeGear.accel, activeGear.maxSpeed);
            }
          }
        } else {
          speed *= FRICTION;
        }

        if (keys.s) {
          playerIsBraking = true;
          if (speed > 0) speed = Math.max(0, speed - BRAKE_POWER);
          else if (speed < 0) speed = Math.min(0, speed + BRAKE_POWER);
        }

        if (Math.abs(speed) < 0.0005) speed = 0;

        const absSpeed = Math.abs(speed);
        const speedRatio = Math.min(absSpeed / 2.00, 1.0);
        const maxSteerLimit = 0.065 * (1.0 - speedRatio * 0.82); 
        const steerBuildRate = 0.0008 + (1.0 - speedRatio) * 0.0006;

        if (keys.a) {
          currentSteerAngle = Math.min(currentSteerAngle + steerBuildRate, maxSteerLimit);
        } else if (keys.d) {
          currentSteerAngle = Math.max(currentSteerAngle - steerBuildRate, -maxSteerLimit);
        } else {
          currentSteerAngle += (0 - currentSteerAngle) * (0.04 + (absSpeed * 0.12));
        }

        if (Math.abs(speed) > 0.002 && !playerPhysics.isAirborne) {
          const turnDirection = speed >= 0 ? 1 : -1;
          carGroup.rotation.y += currentSteerAngle * turnDirection;
        }
      }

      // Drive Forward Translation
      if (!playerPhysics.isAirborne) {
        const forwardVector = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
        carGroup.position.addScaledVector(forwardVector, speed);
      }

      // Physics Rigidbodies & Floor boundary updates
      updatePhysicsBody(playerPhysics);
      updateSparks();
      updateDebris();

      // Vehicle Exact OBB Collision solver
      handleVehicleCollisions();

      // Lights & Steering Visuals
      const activeBrakeMaterial = playerIsBraking ? playerVehicleMesh.activeMat : playerVehicleMesh.idleMat;
      playerVehicleMesh.brakeLights.forEach(light => light.material = activeBrakeMaterial);

      signalTimer += 0.08;
      const isBlinking = Math.sin(signalTimer * 8) > 0;
      playerVehicleMesh.signalMatLeft.visible = (activeSignal === 'LEFT') && isBlinking;
      playerVehicleMesh.signalMatRight.visible = (activeSignal === 'RIGHT') && isBlinking;

      playerVehicleMesh.frontPivots[0].rotation.y = currentSteerAngle * 9;
      playerVehicleMesh.frontPivots[1].rotation.y = currentSteerAngle * 9;
      if (playerVehicleMesh.steeringWheel) {
        playerVehicleMesh.steeringWheel.rotation.z = -currentSteerAngle * 15;
      }

      const targetRoll = -currentSteerAngle * (speed * 2.2);
      playerVehicleMesh.body.rotation.z += (targetRoll - playerVehicleMesh.body.rotation.z) * 0.12;

      // Update AI Traffic Dynamics
      aiCars.forEach(ai => {
        if (!ai.inCrashPhysics) {
          ai.progress += ai.currentSpeed * ai.direction;
          if (ai.progress > 1) ai.progress -= 1;
          if (ai.progress < 0) ai.progress += 1;

          const pos = roadCurve.getPointAt(ai.progress);
          const tangent = roadCurve.getTangentAt(ai.progress);
          const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

          ai.mesh.position.copy(pos).addScaledVector(normal, ai.laneOffset);
          const lookTarget = pos.clone().addScaledVector(tangent, ai.direction).addScaledVector(normal, ai.laneOffset);
          ai.mesh.lookAt(lookTarget);

          const distToPlayer = ai.mesh.position.distanceTo(carGroup.position);
          if (distToPlayer < 18) {
            ai.currentSpeed = Math.max(0, ai.currentSpeed - 0.000002);
            ai.isBraking = true;
          } else {
            ai.currentSpeed = Math.min(ai.targetSpeed, ai.currentSpeed + 0.000001);
            ai.isBraking = false;
          }
        } else {
          updatePhysicsBody(ai);
        }

        // Active Engine Fire Emitter
        if (ai.isExploding) {
          emitSparks(ai.mesh.position.clone().add(new THREE.Vector3(0, 0.8, 0)), 4, true);
        }

        const aiBrakeMat = ai.isBraking ? ai.vehicle.activeMat : ai.vehicle.idleMat;
        ai.vehicle.brakeLights.forEach(light => light.material = aiBrakeMat);
      });

      // Camera Tracking
      grass.position.x = carGroup.position.x;
      grass.position.z = carGroup.position.z;

      const cameraOffset = new THREE.Vector3(0, 3.5, 8).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      camera.position.copy(carGroup.position).add(cameraOffset);
      camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

      const mph = Math.round(Math.abs(speed) * 80);
      document.getElementById('speedometer').innerText = `${mph} MPH`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
