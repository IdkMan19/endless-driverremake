<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Driving Simulator with Advanced Transmission</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #speedometer {
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 5px;
    }
    #gear-display {
      font-size: 20px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 3px;
    }
    #warning {
      font-size: 18px;
      font-weight: bold;
      color: #ff3333;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin:0; font-size: 24px;">Physics Driving Simulator</h1>
    <p style="margin:5px 0 0 0;"><b>W / Up</b> = Throttle | <b>S / Down</b> = Brake</p>
    <p style="margin:2px 0 0 0;"><b>A / D</b> = Steer | <b>Shift</b> = Clutch | <b>Z</b> = Upshift | <b>X</b> = Downshift</p>
    <div id="speedometer">0 MPH</div>
    <div id="gear-display">GEAR: 1</div>
    <div id="warning">MONEY SHIFT! SPINOUT!</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // --- Infinite Grass Plane ---
    const grassGeo = new THREE.PlaneGeometry(3000, 3000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -0.05;
    scene.add(grass);

    // --- Curved 2-Lane Road Mesh Generator ---
    const ROAD_WIDTH = 18;
    const NUM_POINTS = 400;
    const pathPoints = [];

    let rX = 0, rZ = 0;
    for (let i = 0; i < NUM_POINTS; i++) {
      pathPoints.push(new THREE.Vector3(rX, 0, rZ));
      rZ -= 25;
      rX += Math.sin(i * 0.12) * 22;
    }

    const roadCurve = new THREE.CatmullRomCurve3(pathPoints);
    const curvePoints = roadCurve.getSpacedPoints(800);

    // Build Flat Asphalt Ribbon Geometry
    const roadVertices = [];
    const roadIndices = [];

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const leftPt = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2);
      const rightPt = pt.clone().addScaledVector(normal, -ROAD_WIDTH / 2);

      roadVertices.push(leftPt.x, 0.01, leftPt.z);
      roadVertices.push(rightPt.x, 0.01, rightPt.z);

      if (i < curvePoints.length - 1) {
        const base = i * 2;
        roadIndices.push(base, base + 1, base + 2);
        roadIndices.push(base + 1, base + 3, base + 2);
      }
    }

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222225, side: THREE.DoubleSide });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    scene.add(roadMesh);

    // --- Road Markings ---
    const lineMatYellow = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const lineMatWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });

    for (let i = 0; i < curvePoints.length - 1; i++) {
      const pt = curvePoints[i];
      const nextPt = curvePoints[i + 1];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      if (i % 3 === 0) {
        const centerDash = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, 3), lineMatYellow);
        centerDash.position.copy(pt);
        centerDash.position.y = 0.03;
        centerDash.lookAt(nextPt);
        scene.add(centerDash);
      }

      const leftEdge = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, 3.5), lineMatWhite);
      leftEdge.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      leftEdge.position.y = 0.03;
      leftEdge.lookAt(nextPt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6));
      scene.add(leftEdge);

      const rightEdge = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, 3.5), lineMatWhite);
      rightEdge.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      rightEdge.position.y = 0.03;
      rightEdge.lookAt(nextPt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6)));
      scene.add(rightEdge);
    }

    // Scenery Trees
    const treeGeo = new THREE.ConeGeometry(2.5, 7, 5);
    const treeMat = new THREE.MeshLambertMaterial({ color: 0x1b5e20 });

    for (let i = 5; i < curvePoints.length; i += 5) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const treeL = new THREE.Mesh(treeGeo, treeMat);
      treeL.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 + 6 + Math.random() * 15);
      treeL.position.y = 3.5;
      scene.add(treeL);

      const treeR = new THREE.Mesh(treeGeo, treeMat);
      treeR.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 + 6 + Math.random() * 15));
      treeR.position.y = 3.5;
      scene.add(treeR);
    }

    // --- Helper to Build Car Models ---
    function createCarMesh(colorHex) {
      const carGroup = new THREE.Group();
      const carBodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
      const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4), carBodyMat);
      carBody.position.y = 0.5;
      carGroup.add(carBody);

      const cabinMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), cabinMat);
      cabin.position.set(0, 1.2, -0.2);
      carGroup.add(cabin);

      const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
      const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
      wheelGeo.rotateZ(Math.PI / 2);

      const wheelPositions = [
        [-1.1, 0.4, 1.2],
        [1.1, 0.4, 1.2],
        [-1.1, 0.4, -1.2],
        [1.1, 0.4, -1.2]
      ];

      wheelPositions.forEach((pos) => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(...pos);
        carGroup.add(wheel);
      });

      return carGroup;
    }

    // --- Player Car ---
    const carGroup = createCarMesh(0xcc0000);
    scene.add(carGroup);
    carGroup.position.set(0, 0, 0);

    // --- AI Traffic System ---
    const aiCars = [];
    const trafficColors = [0x0055ff, 0xffaa00, 0x888888, 0x00aa44, 0x9900cc];
    const NUM_AI_CARS = 12;

    for (let i = 0; i < NUM_AI_CARS; i++) {
      const color = trafficColors[i % trafficColors.length];
      const mesh = createCarMesh(color);
      scene.add(mesh);

      const progress = (i / NUM_AI_CARS) + 0.05;
      const laneSide = i % 2 === 0 ? 1 : -1;
      const laneOffset = (ROAD_WIDTH / 4) * laneSide;

      const baseSpeed = (0.0008 + Math.random() * 0.0004) * 0.2;

      aiCars.push({
        mesh: mesh,
        progress: progress,
        targetSpeed: baseSpeed,
        currentSpeed: baseSpeed,
        laneOffset: laneOffset,
        direction: laneSide
      });
    }

    // --- Gear Index Setup ---
    const gearList = ['R', 'N', '1', '2', '3', '4', '5'];
    let currentGearIndex = 2; // Start in 1st gear ('1')

    const gearRatios = {
      'R': { accel: -0.005, maxSpeed: -0.35, isReverse: true },
      'N': { accel: 0, maxSpeed: 0, isNeutral: true },
      '1': { accel: 0.012, maxSpeed: 0.35 },
      '2': { accel: 0.009, maxSpeed: 0.60 },
      '3': { accel: 0.007, maxSpeed: 0.85 },
      '4': { accel: 0.005, maxSpeed: 1.10 },
      '5': { accel: 0.003, maxSpeed: 1.35 }
    };

    // --- Driving Physics Parameters ---
    let speed = 0;
    let steeringInputPower = 0;
    let isSpinningOut = false;
    let spinoutTimer = 0;
    let spinoutVelocity = 0;

    const BRAKE_POWER = 0.035;
    const FRICTION = 0.985;
    const STEER_RAMP_SPEED = 0.015;
    const MAX_STEER_ANGLE = 0.035;

    const keys = { forward: false, backward: false, left: false, right: false, clutch: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'Shift') keys.clutch = true;

      // Manual Gear Shift with Z (Upshift) and X (Downshift)
      if (keys.clutch && !isSpinningOut) {
        const oldGear = gearList[currentGearIndex];

        if (e.key === 'z' || e.key === 'Z') {
          if (currentGearIndex < gearList.length - 1) {
            currentGearIndex++;
          }
        } else if (e.key === 'x' || e.key === 'X') {
          if (currentGearIndex > 0) {
            currentGearIndex--;
          }
        }

        const newGear = gearList[currentGearIndex];
        document.getElementById('gear-display').innerText = `GEAR: ${newGear}`;

        // Money-Shift Spin-Out Detection (5th directly to 1st or R at high speeds)
        if (oldGear === '5' && (newGear === '1' || newGear === 'R') && Math.abs(speed) > 0.7) {
          triggerSpinout();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
      if (e.key === 'Shift') keys.clutch = false;
    });

    function triggerSpinout() {
      isSpinningOut = true;
      spinoutTimer = 120; // Spinout lasts ~2 seconds
      spinoutVelocity = speed;
      document.getElementById('warning').style.display = 'block';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const currentGearKey = gearList[currentGearIndex];
      const activeGear = gearRatios[currentGearKey];

      if (isSpinningOut) {
        // Spin-Out Sequence: Lock wheels and rotate vehicle wildly
        carGroup.rotation.y += 0.25;
        speed *= 0.96; // Friction slowly stops locked wheels
        spinoutTimer--;

        if (spinoutTimer <= 0) {
          isSpinningOut = false;
          speed = 0;
          document.getElementById('warning').style.display = 'none';
        }
      } else {
        // Normal Acceleration & Braking Physics
        if (keys.forward) {
          if (!keys.clutch && !activeGear.isNeutral) {
            if (activeGear.isReverse) {
              // Accelerate backwards in Reverse gear
              speed = Math.max(speed + activeGear.accel, activeGear.maxSpeed);
            } else {
              // Accelerate forward in 1st - 5th gears
              speed = Math.min(speed + activeGear.accel, activeGear.maxSpeed);
            }
          }
        } else {
          speed *= FRICTION;
        }

        // Dedicated Brake Control (S / Down Arrow)
        if (keys.backward) {
          if (speed > 0) {
            speed = Math.max(0, speed - BRAKE_POWER);
          } else if (speed < 0) {
            speed = Math.min(0, speed + BRAKE_POWER);
          }
        }

        if (Math.abs(speed) < 0.001) speed = 0;

        // Steering Logic
        if (keys.left) {
          steeringInputPower = Math.min(steeringInputPower + STEER_RAMP_SPEED, 1.0);
        } else if (keys.right) {
          steeringInputPower = Math.max(steeringInputPower - STEER_RAMP_SPEED, -1.0);
        } else {
          steeringInputPower *= 0.75;
        }

        if (Math.abs(speed) > 0.005) {
          const turnDirection = speed >= 0 ? 1 : -1;
          const currentTurnRate = steeringInputPower * MAX_STEER_ANGLE;
          carGroup.rotation.y += currentTurnRate * turnDirection * (Math.abs(speed) / 1.35);
        }
      }

      // Movement Vector
      const forwardVector = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      carGroup.position.addScaledVector(forwardVector, speed);

      // --- Update AI Traffic ---
      aiCars.forEach(ai => {
        ai.progress += ai.currentSpeed * ai.direction;
        if (ai.progress > 0.98) ai.progress = 0.02;
        if (ai.progress < 0.02) ai.progress = 0.98;

        const pos = roadCurve.getPointAt(ai.progress);
        const tangent = roadCurve.getTangentAt(ai.progress);
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

        ai.mesh.position.copy(pos).addScaledVector(normal, ai.laneOffset);
        
        const lookTarget = pos.clone().addScaledVector(tangent, ai.direction).addScaledVector(normal, ai.laneOffset);
        ai.mesh.lookAt(lookTarget);

        const distToPlayer = ai.mesh.position.distanceTo(carGroup.position);
        if (distToPlayer < 18) {
          ai.currentSpeed = Math.max(0, ai.currentSpeed - 0.00002);
        } else {
          ai.currentSpeed = Math.min(ai.targetSpeed, ai.currentSpeed + 0.00001);
        }
      });

      // Infinite Grass Follow
      grass.position.x = carGroup.position.x;
      grass.position.z = carGroup.position.z;

      // Camera Follow
      const cameraOffset = new THREE.Vector3(0, 3.5, 8).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      camera.position.copy(carGroup.position).add(cameraOffset);
      
      const lookAtTarget = carGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      camera.lookAt(lookAtTarget);

      // UI Updates
      const mph = Math.round(Math.abs(speed) * 80);
      document.getElementById('speedometer').innerText = `${mph} MPH`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
