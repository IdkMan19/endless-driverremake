<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Driving Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #speedometer {
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin:0; font-size: 24px;">Endless Physics Drive</h1>
    <p style="margin:5px 0 0 0;"><b>W / Up</b> = Accelerate | <b>S / Down</b> = Brake / Reverse</p>
    <p style="margin:2px 0 0 0;"><b>A / D</b> or <b>Left / Right</b> = Steer</p>
    <div id="speedometer">0 MPH</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, 150, 50);
    scene.add(dirLight);

    // --- Infinite Grass Ground ---
    // A massive plane that locks onto the car's position so it never ends
    const grassGeo = new THREE.PlaneGeometry(5000, 5000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -0.05;
    scene.add(grass);

    // --- Two-Lane Road Generation ---
    const ROAD_WIDTH = 18; // Full two-lane road width
    const pathPoints = [];
    
    // Generate a long winding road path
    let rX = 0, rZ = 0;
    for (let i = 0; i < 300; i++) {
      pathPoints.push(new THREE.Vector3(rX, 0, rZ));
      rZ -= 40;
      rX += Math.sin(i * 0.15) * 35;
    }

    const roadCurve = new THREE.CatmullRomCurve3(pathPoints);

    // 1. Asphalt Surface (Main Road Mesh)
    const roadGeo = new THREE.TubeGeometry(roadCurve, 1000, ROAD_WIDTH / 2, 2, false);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x2c2c30, side: THREE.DoubleSide });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.scale.set(1, 0.01, 1);
    scene.add(roadMesh);

    // 2. Road Markings (Dashed Center Line & Solid Shoulders)
    const roadSamples = roadCurve.getSpacedPoints(800);
    const centerDashGeo = new THREE.BoxGeometry(0.3, 0.05, 3);
    const centerDashMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

    const shoulderLineGeo = new THREE.BoxGeometry(0.3, 0.05, 4);
    const shoulderLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    for (let i = 0; i < roadSamples.length - 1; i++) {
      const pt = roadSamples[i];
      const nextPt = roadSamples[i + 1];
      const tangent = roadCurve.getTangentAt(i / roadSamples.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      // Yellow Center Dashed Line (Every 2 steps)
      if (i % 2 === 0) {
        const centerDash = new THREE.Mesh(centerDashGeo, centerDashMat);
        centerDash.position.copy(pt);
        centerDash.position.y = 0.02;
        centerDash.lookAt(nextPt);
        scene.add(centerDash);
      }

      // Solid White Outer Shoulder Lines (Left & Right)
      if (i % 2 === 0) {
        const leftLine = new THREE.Mesh(shoulderLineGeo, shoulderLineMat);
        leftLine.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
        leftLine.position.y = 0.02;
        leftLine.lookAt(nextPt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6));
        scene.add(leftLine);

        const rightLine = new THREE.Mesh(shoulderLineGeo, shoulderLineMat);
        rightLine.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
        rightLine.position.y = 0.02;
        rightLine.lookAt(nextPt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6)));
        scene.add(rightLine);
      }
    }

    // --- Scenery (Trees along Road) ---
    const treeGeo = new THREE.ConeGeometry(2.5, 7, 5);
    const treeMat = new THREE.MeshLambertMaterial({ color: 0x1b5e20 });

    for (let i = 5; i < roadSamples.length; i += 4) {
      const pt = roadSamples[i];
      const tangent = roadCurve.getTangentAt(i / roadSamples.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      // Left Tree
      const treeL = new THREE.Mesh(treeGeo, treeMat);
      treeL.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 + 6 + Math.random() * 12);
      treeL.position.y = 3.5;
      scene.add(treeL);

      // Right Tree
      const treeR = new THREE.Mesh(treeGeo, treeMat);
      treeR.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 + 6 + Math.random() * 12));
      treeR.position.y = 3.5;
      scene.add(treeR);
    }

    // --- Player Car Mesh ---
    const carGroup = new THREE.Group();

    // Body
    const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4), carBodyMat);
    carBody.position.y = 0.5;
    carGroup.add(carBody);

    // Cabin
    const cabinMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), cabinMat);
    cabin.position.set(0, 1.2, -0.2);
    carGroup.add(cabin);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    wheelGeo.rotateZ(Math.PI / 2);

    const wheelPositions = [
      [-1.1, 0.4, 1.2],
      [1.1, 0.4, 1.2],
      [-1.1, 0.4, -1.2],
      [1.1, 0.4, -1.2]
    ];

    wheelPositions.forEach((pos) => {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.position.set(...pos);
      carGroup.add(wheel);
    });

    scene.add(carGroup);
    carGroup.position.set(0, 0, 0);

    // --- Tuned Physics Controls ---
    let speed = 0;
    let steeringAngle = 0;
    let steerHoldTime = 0; // Tracks how long a turn key is held
    
    const ACCEL = 0.007;           // Slower acceleration
    const BRAKE = 0.035;           // More sensitive, responsive brakes
    const REVERSE_ACCEL = 0.005;   // Slower reverse acceleration
    const FRICTION = 0.985;        // Coasting deceleration
    const MAX_SPEED = 1.3;
    const MAX_REVERSE = -0.35;
    
    const BASE_STEER = 0.012;      // Smooth initial turn entry
    const MAX_STEER = 0.032;       // Maximum gradual turn tightness

    const keys = { forward: false, backward: false, left: false, right: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // 1. Acceleration & Sensitive Braking
      if (keys.forward) {
        if (speed < 0) {
          speed += BRAKE; // Applying brake while in reverse
        } else {
          speed = Math.min(speed + ACCEL, MAX_SPEED);
        }
      } else if (keys.backward) {
        if (speed > 0) {
          speed -= BRAKE; // Sensitive brake when pressing S/Down while moving forward
        } else {
          speed = Math.max(speed - REVERSE_ACCEL, MAX_REVERSE);
        }
      } else {
        speed *= FRICTION;
      }

      if (Math.abs(speed) < 0.001) speed = 0;

      // 2. Smooth Ramp-In Steering Logic
      if (keys.left || keys.right) {
        steerHoldTime = Math.min(steerHoldTime + 0.02, 1.0); // Smoothly ramp up hold factor
        const currentSteerRate = BASE_STEER + (MAX_STEER - BASE_STEER) * steerHoldTime;

        if (keys.left) {
          steeringAngle = Math.min(steeringAngle + 0.005, currentSteerRate);
        } else if (keys.right) {
          steeringAngle = Math.max(steeringAngle - 0.005, -currentSteerRate);
        }
      } else {
        steerHoldTime = 0;
        steeringAngle *= 0.75; // Quickly smooth back to center when released
      }

      // Vehicle turning strictly proportional to forward/reverse movement
      if (Math.abs(speed) > 0.005) {
        const turnDirection = speed >= 0 ? 1 : -1;
        carGroup.rotation.y += steeringAngle * turnDirection * (Math.abs(speed) / MAX_SPEED);
      }

      // 3. Move Car Position
      const forwardVector = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      carGroup.position.addScaledVector(forwardVector, speed);

      // 4. Lock Grass Terrain Under Car (Fixes grass disappearing)
      grass.position.x = carGroup.position.x;
      grass.position.z = carGroup.position.z;

      // 5. Camera Tracking
      const cameraOffset = new THREE.Vector3(0, 3.5, 8.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      camera.position.copy(carGroup.position).add(cameraOffset);
      
      const lookAtTarget = carGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      camera.lookAt(lookAtTarget);

      // 6. UI Update
      const mph = Math.round(Math.abs(speed) * 75);
      document.getElementById('speedometer').innerText = `${mph} MPH`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
