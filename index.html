<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Driving Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #speedometer {
      font-size: 20px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin:0; font-size: 24px;">Physics Driving Simulator</h1>
    <p style="margin:5px 0 0 0;"><b>W / Up</b> = Accelerate | <b>S / Down</b> = Brake / Reverse</p>
    <p style="margin:2px 0 0 0;"><b>A / D</b> or <b>Left / Right</b> = Steer</p>
    <div id="speedometer">0 MPH</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // --- Infinite Grass Plane ---
    const grassGeo = new THREE.PlaneGeometry(3000, 3000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -0.05;
    scene.add(grass);

    // --- Curved 2-Lane Road Mesh Generator ---
    const ROAD_WIDTH = 18; // Full width of the 2-lane asphalt
    const NUM_POINTS = 400;
    const pathPoints = [];

    // Generate road curve points
    let rX = 0, rZ = 0;
    for (let i = 0; i < NUM_POINTS; i++) {
      pathPoints.push(new THREE.Vector3(rX, 0, rZ));
      rZ -= 25;
      rX += Math.sin(i * 0.12) * 22; // Smooth turns
    }

    const roadCurve = new THREE.CatmullRomCurve3(pathPoints);
    const curvePoints = roadCurve.getSpacedPoints(800);

    // Build Flat Asphalt Ribbon Geometry
    const roadVertices = [];
    const roadIndices = [];

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      // Perpendicular vector along the horizontal plane (X/Z)
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      // Left vertex of asphalt
      const leftPt = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2);
      // Right vertex of asphalt
      const rightPt = pt.clone().addScaledVector(normal, -ROAD_WIDTH / 2);

      roadVertices.push(leftPt.x, 0.01, leftPt.z);
      roadVertices.push(rightPt.x, 0.01, rightPt.z);

      if (i < curvePoints.length - 1) {
        const base = i * 2;
        roadIndices.push(base, base + 1, base + 2);
        roadIndices.push(base + 1, base + 3, base + 2);
      }
    }

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222225, side: THREE.DoubleSide });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    scene.add(roadMesh);

    // --- Road Markings (Yellow Dashed Center + White Solid Edge Shoulders) ---
    const lineMatYellow = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const lineMatWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });

    for (let i = 0; i < curvePoints.length - 1; i++) {
      const pt = curvePoints[i];
      const nextPt = curvePoints[i + 1];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      // Yellow Center Dash
      if (i % 3 === 0) {
        const centerDash = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, 3), lineMatYellow);
        centerDash.position.copy(pt);
        centerDash.position.y = 0.03;
        centerDash.lookAt(nextPt);
        scene.add(centerDash);
      }

      // White Left Shoulder Line
      const leftEdge = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, 3.5), lineMatWhite);
      leftEdge.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      leftEdge.position.y = 0.03;
      leftEdge.lookAt(nextPt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6));
      scene.add(leftEdge);

      // White Right Shoulder Line
      const rightEdge = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, 3.5), lineMatWhite);
      rightEdge.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      rightEdge.position.y = 0.03;
      rightEdge.lookAt(nextPt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6)));
      scene.add(rightEdge);
    }

    // Scenery Trees
    const treeGeo = new THREE.ConeGeometry(2.5, 7, 5);
    const treeMat = new THREE.MeshLambertMaterial({ color: 0x1b5e20 });

    for (let i = 5; i < curvePoints.length; i += 5) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const treeL = new THREE.Mesh(treeGeo, treeMat);
      treeL.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 + 6 + Math.random() * 15);
      treeL.position.y = 3.5;
      scene.add(treeL);

      const treeR = new THREE.Mesh(treeGeo, treeMat);
      treeR.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 + 6 + Math.random() * 15));
      treeR.position.y = 3.5;
      scene.add(treeR);
    }

    // --- Player Car ---
    const carGroup = new THREE.Group();

    const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4), carBodyMat);
    carBody.position.y = 0.5;
    carGroup.add(carBody);

    const cabinMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), cabinMat);
    cabin.position.set(0, 1.2, -0.2);
    carGroup.add(cabin);

    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    wheelGeo.rotateZ(Math.PI / 2);

    const wheelPositions = [
      [-1.1, 0.4, 1.2],
      [1.1, 0.4, 1.2],
      [-1.1, 0.4, -1.2],
      [1.1, 0.4, -1.2]
    ];

    wheelPositions.forEach((pos) => {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.position.set(...pos);
      carGroup.add(wheel);
    });

    scene.add(carGroup);
    carGroup.position.set(0, 0, 0);

    // --- Driving Physics Parameters ---
    let speed = 0;
    let steeringInputPower = 0;
    
    const ACCEL = 0.007;
    const BRAKE_POWER = 0.035;
    const REVERSE_ACCEL = 0.005;
    const FRICTION = 0.985;
    const MAX_SPEED = 1.2;
    const MAX_REVERSE = -0.35;
    
    const STEER_RAMP_SPEED = 0.015;
    const MAX_STEER_ANGLE = 0.035;

    const keys = { forward: false, backward: false, left: false, right: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // Acceleration & Braking
      if (keys.forward) {
        if (speed < 0) {
          speed += BRAKE_POWER;
        } else {
          speed = Math.min(speed + ACCEL, MAX_SPEED);
        }
      } else if (keys.backward) {
        if (speed > 0) {
          speed -= BRAKE_POWER;
        } else {
          speed = Math.max(speed - REVERSE_ACCEL, MAX_REVERSE);
        }
      } else {
        speed *= FRICTION;
      }

      if (Math.abs(speed) < 0.001) speed = 0;

      // Steering
      if (keys.left) {
        steeringInputPower = Math.min(steeringInputPower + STEER_RAMP_SPEED, 1.0);
      } else if (keys.right) {
        steeringInputPower = Math.max(steeringInputPower - STEER_RAMP_SPEED, -1.0);
      } else {
        steeringInputPower *= 0.75;
      }

      if (Math.abs(speed) > 0.005) {
        const turnDirection = speed >= 0 ? 1 : -1;
        const currentTurnRate = steeringInputPower * MAX_STEER_ANGLE;
        carGroup.rotation.y += currentTurnRate * turnDirection * (Math.abs(speed) / MAX_SPEED);
      }

      // Movement
      const forwardVector = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      carGroup.position.addScaledVector(forwardVector, speed);

      // Infinite Grass Follow
      grass.position.x = carGroup.position.x;
      grass.position.z = carGroup.position.z;

      // Camera Follow
      const cameraOffset = new THREE.Vector3(0, 3.5, 8).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      camera.position.copy(carGroup.position).add(cameraOffset);
      
      const lookAtTarget = carGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      camera.lookAt(lookAtTarget);

      // UI
      const mph = Math.round(Math.abs(speed) * 80);
      document.getElementById('speedometer').innerText = `${mph} MPH`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
