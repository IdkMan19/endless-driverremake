<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Driving Simulator - High-Detail Mesh Edition</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #speedometer {
      font-size: 26px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 5px;
    }
    #gear-display {
      font-size: 20px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 3px;
    }
    #signals-display {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 5px;
    }
    #warning {
      font-size: 20px;
      font-weight: bold;
      color: #ff3333;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin:0; font-size: 24px;">Physics Driving Simulator</h1>
    <p style="margin:5px 0 0 0;"><b>W</b> = Throttle | <b>S</b> = Brake | <b>A / D</b> = Steer</p>
    <p style="margin:2px 0 0 0;"><b>Shift + Up/Down</b> = Gear Shift | <b>Left/Right Arrows</b> = Turn Signals</p>
    <div id="speedometer">0 MPH</div>
    <div id="gear-display">GEAR: 1</div>
    <div id="signals-display">SIGNAL: OFF</div>
    <div id="warning">MONEY SHIFT! SPINOUT!</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(60, 120, 60);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 500;
    const d = 100;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // --- Infinite Grass Plane with Collision Floor Level ---
    const FLOOR_Y = 0.0;
    const grassGeo = new THREE.PlaneGeometry(3000, 3000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = FLOOR_Y - 0.05;
    grass.receiveShadow = true;
    scene.add(grass);

    // --- Road Setup ---
    const ROAD_WIDTH = 18;
    const NUM_POINTS = 300;
    const pathPoints = [];

    const radiusX = 600 + Math.random() * 300;
    const radiusZ = 600 + Math.random() * 300;

    for (let i = 0; i < NUM_POINTS; i++) {
      const angle = (i / NUM_POINTS) * Math.PI * 2;
      const wave = Math.sin(angle * 5) * 40 + Math.cos(angle * 3) * 30;
      const x = Math.cos(angle) * (radiusX + wave);
      const z = Math.sin(angle) * (radiusZ + wave);
      pathPoints.push(new THREE.Vector3(x, 0, z));
    }

    const roadCurve = new THREE.CatmullRomCurve3(pathPoints, true);
    const curvePoints = roadCurve.getSpacedPoints(1200);

    const roadVertices = [];
    const roadIndices = [];

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const leftPt = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2);
      const rightPt = pt.clone().addScaledVector(normal, -ROAD_WIDTH / 2);

      roadVertices.push(leftPt.x, FLOOR_Y + 0.01, leftPt.z);
      roadVertices.push(rightPt.x, FLOOR_Y + 0.01, rightPt.z);

      if (i < curvePoints.length - 1) {
        const base = i * 2;
        roadIndices.push(base, base + 1, base + 2);
        roadIndices.push(base + 1, base + 3, base + 2);
      }
    }
    const lastBase = (curvePoints.length - 1) * 2;
    roadIndices.push(lastBase, lastBase + 1, 0);
    roadIndices.push(lastBase + 1, 1, 0);

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222225, side: THREE.DoubleSide });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    scene.add(roadMesh);

    // --- Markings & Scenery ---
    const lineMatYellow = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
    const lineMatWhite = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });

    const dashGeo = new THREE.PlaneGeometry(0.35, 3);
    dashGeo.rotateX(-Math.PI / 2);
    const edgeGeo = new THREE.PlaneGeometry(0.35, 3.5);
    edgeGeo.rotateX(-Math.PI / 2);

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const nextPt = curvePoints[(i + 1) % curvePoints.length];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      if (i % 3 === 0) {
        const centerDash = new THREE.Mesh(dashGeo, lineMatYellow);
        centerDash.position.set(pt.x, FLOOR_Y + 0.02, pt.z);
        centerDash.lookAt(nextPt.x, FLOOR_Y + 0.02, nextPt.z);
        scene.add(centerDash);
      }

      const leftPos = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      const leftNext = nextPt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      const leftEdge = new THREE.Mesh(edgeGeo, lineMatWhite);
      leftEdge.position.set(leftPos.x, FLOOR_Y + 0.02, leftPos.z);
      leftEdge.lookAt(leftNext.x, FLOOR_Y + 0.02, leftNext.z);
      scene.add(leftEdge);

      const rightPos = pt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      const rightNext = nextPt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      const rightEdge = new THREE.Mesh(edgeGeo, lineMatWhite);
      rightEdge.position.set(rightPos.x, FLOOR_Y + 0.02, rightPos.z);
      rightEdge.lookAt(rightNext.x, FLOOR_Y + 0.02, rightNext.z);
      scene.add(rightEdge);
    }

    const treeGeo = new THREE.ConeGeometry(2.5, 7, 8);
    const treeMat = new THREE.MeshLambertMaterial({ color: 0x1b5e20 });

    for (let i = 0; i < curvePoints.length; i += 4) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const treeL = new THREE.Mesh(treeGeo, treeMat);
      treeL.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 + 6 + Math.random() * 18);
      treeL.position.y = FLOOR_Y + 3.5;
      treeL.castShadow = true;
      scene.add(treeL);

      const treeR = new THREE.Mesh(treeGeo, treeMat);
      treeR.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 + 6 + Math.random() * 18));
      treeR.position.y = FLOOR_Y + 3.5;
      treeR.castShadow = true;
      scene.add(treeR);
    }

    // --- Particle System for Friction Sparks & Explosions ---
    const sparkCount = 400;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(sparkCount * 3);
    const sparkVelocities = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPositions[i * 3] = 0;
      sparkPositions[i * 3 + 1] = -100;
      sparkPositions[i * 3 + 2] = 0;
      sparkVelocities.push(new THREE.Vector3());
    }

    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    const sparkMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.35, transparent: true, opacity: 0.95 });
    const sparkParticles = new THREE.Points(sparkGeo, sparkMat);
    scene.add(sparkParticles);

    function emitSparks(location, count, scale = 1.0) {
      const positions = sparkParticles.geometry.attributes.position.array;
      for (let i = 0; i < count; i++) {
        const idx = Math.floor(Math.random() * sparkCount);
        positions[idx * 3] = location.x;
        positions[idx * 3 + 1] = location.y;
        positions[idx * 3 + 2] = location.z;
        
        sparkVelocities[idx].set(
          (Math.random() - 0.5) * 1.5 * scale,
          Math.random() * 0.9 * scale + 0.1,
          (Math.random() - 0.5) * 1.5 * scale
        );
      }
      sparkParticles.geometry.attributes.position.needsUpdate = true;
    }

    function updateSparks() {
      const positions = sparkParticles.geometry.attributes.position.array;
      for (let i = 0; i < sparkCount; i++) {
        if (positions[i * 3 + 1] > -10) {
          positions[i * 3] += sparkVelocities[i].x;
          positions[i * 3 + 1] += sparkVelocities[i].y;
          positions[i * 3 + 2] += sparkVelocities[i].z;
          sparkVelocities[i].y -= 0.03;

          if (positions[i * 3 + 1] <= FLOOR_Y) {
            positions[i * 3 + 1] = FLOOR_Y;
            sparkVelocities[i].multiplyScalar(0.5);
            if (Math.abs(sparkVelocities[i].y) < 0.05) {
              positions[i * 3 + 1] = -100;
            }
          }
        }
      }
      sparkParticles.geometry.attributes.position.needsUpdate = true;
    }

    // --- Debris Management for Crash Destruction ---
    const activeDebris = [];

    function spawnDebrisPiece(geometry, material, position, rotation, velocity, angularVelocity) {
      const debrisMesh = new THREE.Mesh(geometry.clone(), material.clone());
      debrisMesh.position.copy(position);
      debrisMesh.rotation.copy(rotation);
      debrisMesh.castShadow = true;
      debrisMesh.receiveShadow = true;
      scene.add(debrisMesh);

      activeDebris.push({
        mesh: debrisMesh,
        velocity: velocity,
        angularVelocity: angularVelocity,
        life: 360
      });
    }

    function updateDebris() {
      for (let i = activeDebris.length - 1; i >= 0; i--) {
        const d = activeDebris[i];
        d.mesh.position.add(d.velocity);
        d.mesh.rotation.x += d.angularVelocity.x;
        d.mesh.rotation.y += d.angularVelocity.y;
        d.mesh.rotation.z += d.angularVelocity.z;

        if (d.mesh.position.y <= FLOOR_Y + 0.1) {
          d.mesh.position.y = FLOOR_Y + 0.1;
          d.velocity.y = -d.velocity.y * 0.3;
          d.velocity.x *= 0.85;
          d.velocity.z *= 0.85;
          d.angularVelocity.multiplyScalar(0.85);
        } else {
          d.velocity.y -= 0.015;
        }

        d.life--;
        if (d.life <= 0) {
          scene.remove(d.mesh);
          activeDebris.splice(i, 1);
        }
      }
    }

    // --- Helper Functions for High-Density Custom Geometries ---
    function createHighResBodyGeometry() {
      const shape = new THREE.Shape();
      shape.moveTo(-1.0, -2.1);
      shape.lineTo(-1.05, -1.8);
      shape.quadraticCurveTo(-1.1, -0.5, -1.1, 0.5);
      shape.lineTo(-1.05, 1.8);
      shape.lineTo(-0.95, 2.15);
      shape.lineTo(0.95, 2.15);
      shape.lineTo(1.05, 1.8);
      shape.quadraticCurveTo(1.1, 0.5, 1.1, -0.5);
      shape.lineTo(1.05, -1.8);
      shape.lineTo(1.0, -2.1);
      shape.closePath();

      const extrudeSettings = {
        steps: 12,
        depth: 0.65,
        bevelEnabled: true,
        bevelThickness: 0.15,
        bevelSize: 0.12,
        bevelOffset: 0,
        bevelSegments: 8
      };

      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(Math.PI / 2);
      geo.center();
      
      // Deform vertices to craft sleek aerodynamic sports car contours
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        // Taper hood down towards front bumper
        if (z < -0.8) {
          y *= 0.65 + (z + 0.8) * 0.2;
        }
        // Taper rear end gently
        if (z > 1.2) {
          y *= 0.85;
        }
        // Flare wheel arches
        if ((z > -1.5 && z < -0.8) || (z > 0.8 && z < 1.5)) {
          if (Math.abs(x) > 0.85) {
            x *= 1.12;
          }
        }
        pos.setXYZ(i, x, y, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function createHighResCabinGeometry() {
      const geo = new THREE.BoxGeometry(1.6, 0.65, 2.0, 16, 8, 16);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        // Slanted windshield and rear window slope
        if (y > 0) {
          x *= 0.82;
          z *= 0.82;
        }
        if (z < 0) {
          z -= y * 0.35; // Raked windshield
        } else {
          z += y * 0.2;  // Raked rear glass
        }
        pos.setXYZ(i, x, y, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function createDetailedWheelGeometry() {
      const wheelGroup = new THREE.Group();
      
      // High-segment tire mesh
      const tireGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.34, 32, 4);
      tireGeo.rotateZ(Math.PI / 2);
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
      const tireMesh = new THREE.Mesh(tireGeo, tireMat);
      tireMesh.castShadow = true;
      wheelGroup.add(tireMesh);

      // Detailed metallic rim with brake caliper details
      const rimGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.35, 24, 2);
      rimGeo.rotateZ(Math.PI / 2);
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.2 });
      const rimMesh = new THREE.Mesh(rimGeo, rimMat);
      wheelGroup.add(rimMesh);

      // Multi-spoke interior pattern
      const spokeMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8, roughness: 0.3 });
      for (let i = 0; i < 5; i++) {
        const spokeGeo = new THREE.BoxGeometry(0.06, 0.38, 0.04);
        const spoke = new THREE.Mesh(spokeGeo, spokeMat);
        spoke.rotation.x = (i * Math.PI * 2) / 5;
        wheelGroup.add(spoke);
      }

      return wheelGroup;
    }

    // --- High-Detail Detachable Modular Vehicle Assembly ---
    function createCarMesh(colorHex) {
      const carGroup = new THREE.Group();
      const visualBody = new THREE.Group();
      carGroup.add(visualBody);

      const carBodyMat = new THREE.MeshStandardMaterial({ 
        color: colorHex, 
        metalness: 0.6, 
        roughness: 0.3,
        envMapIntensity: 1.0 
      });
      const bumperMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
      const glassMat = new THREE.MeshPhysicalMaterial({ 
        color: 0x112233, 
        metalness: 0.1, 
        roughness: 0.1, 
        transmission: 0.6, 
        transparent: true, 
        opacity: 0.85 
      });
      const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const taillightIdleMat = new THREE.MeshBasicMaterial({ color: 0x660000 });
      const brakeLightActiveMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const engineMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.4 });
      const fireMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });

      const signalMatLeft = new THREE.MeshBasicMaterial({ color: 0xffaa00, visible: false });
      const signalMatRight = new THREE.MeshBasicMaterial({ color: 0xffaa00, visible: false });

      // Detailed Engine Block Assembly with Intake Details
      const engineBlockGeo = new THREE.BoxGeometry(1.2, 0.55, 1.1, 8, 4, 8);
      const engineBlock = new THREE.Mesh(engineBlockGeo, engineMat);
      engineBlock.position.set(0, 0.55, -1.2);
      engineBlock.castShadow = true;
      visualBody.add(engineBlock);

      // Detailed Flame Mesh
      const fireMesh = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16), fireMat);
      fireMesh.position.set(0, 0.75, -1.2);
      fireMesh.visible = false;
      visualBody.add(fireMesh);

      // Smooth High-Vertex Curved Main Body
      const carBodyGeo = createHighResBodyGeometry();
      const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
      carBody.position.y = 0.55;
      carBody.castShadow = true;
      carBody.receiveShadow = true;
      visualBody.add(carBody);

      // Smooth Curved Windshield / Cabin Glass
      const cabinGeo = createHighResCabinGeometry();
      const cabin = new THREE.Mesh(cabinGeo, glassMat);
      cabin.position.set(0, 1.15, -0.05);
      cabin.castShadow = true;
      visualBody.add(cabin);

      // Curved Front Bumper
      const frontBumperGeo = new THREE.BoxGeometry(2.15, 0.32, 0.3, 12, 4, 4);
      const frontBumper = new THREE.Mesh(frontBumperGeo, bumperMat);
      frontBumper.position.set(0, 0.35, -2.12);
      frontBumper.castShadow = true;
      visualBody.add(frontBumper);

      // Curved Rear Bumper
      const rearBumperGeo = new THREE.BoxGeometry(2.15, 0.32, 0.3, 12, 4, 4);
      const rearBumper = new THREE.Mesh(rearBumperGeo, bumperMat);
      rearBumper.position.set(0, 0.35, 2.12);
      rearBumper.castShadow = true;
      visualBody.add(rearBumper);

      // High-Detail Light Meshes
      const headlightGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.1, 16);
      headlightGeo.rotateX(Math.PI / 2);
      const headlightL = new THREE.Mesh(headlightGeo, headlightMat);
      headlightL.position.set(-0.68, 0.62, -2.13);
      visualBody.add(headlightL);

      const headlightR = new THREE.Mesh(headlightGeo, headlightMat);
      headlightR.position.set(0.68, 0.62, -2.13);
      visualBody.add(headlightR);

      const taillightGeo = new THREE.BoxGeometry(0.42, 0.16, 0.08, 4, 2, 2);
      const taillightL = new THREE.Mesh(taillightGeo, taillightIdleMat);
      taillightL.position.set(-0.68, 0.62, 2.13);
      visualBody.add(taillightL);

      const taillightR = new THREE.Mesh(taillightGeo, taillightIdleMat);
      taillightR.position.set(0.68, 0.62, 2.13);
      visualBody.add(taillightR);

      const signalGeo = new THREE.BoxGeometry(0.2, 0.14, 0.08);
      const signalFL = new THREE.Mesh(signalGeo, signalMatLeft);
      signalFL.position.set(-0.95, 0.62, -2.12);
      visualBody.add(signalFL);

      const signalRL = new THREE.Mesh(signalGeo, signalMatLeft);
      signalRL.position.set(-0.95, 0.62, 2.12);
      visualBody.add(signalRL);

      const signalFR = new THREE.Mesh(signalGeo, signalMatRight);
      signalFR.position.set(0.95, 0.62, -2.12);
      visualBody.add(signalFR);

      const signalRR = new THREE.Mesh(signalGeo, signalMatRight);
      signalRR.position.set(0.95, 0.62, 2.12);
      visualBody.add(signalRR);

      // High-Detail Wheels Assembly
      const rearLeft = createDetailedWheelGeometry();
      rearLeft.position.set(-1.08, 0.4, 1.25);
      visualBody.add(rearLeft);

      const rearRight = createDetailedWheelGeometry();
      rearRight.position.set(1.08, 0.4, 1.25);
      visualBody.add(rearRight);

      const frontLeftPivot = createDetailedWheelGeometry();
      frontLeftPivot.position.set(-1.08, 0.4, -1.25);
      visualBody.add(frontLeftPivot);

      const frontRightPivot = createDetailedWheelGeometry();
      frontRightPivot.position.set(1.08, 0.4, -1.25);
      visualBody.add(frontRightPivot);

      return {
        root: carGroup,
        body: visualBody,
        frontPivots: [frontLeftPivot, frontRightPivot],
        brakeLights: [taillightL, taillightR],
        idleMat: taillightIdleMat,
        activeMat: brakeLightActiveMat,
        signalMatLeft: signalMatLeft,
        signalMatRight: signalMatRight,
        fireMesh: fireMesh,
        parts: {
          frontBumper, rearBumper, cabin, carBody,
          frontLeftWheel: frontLeftPivot, frontRightWheel: frontRightPivot,
          rearLeftWheel: rearLeft, rearRightWheel: rearRight
        }
      };
    }

    // --- Dynamic Physics Object with Exact OBB Hitbox Bounds ---
    function createPhysicsObject(meshData) {
      return {
        vehicle: meshData,
        mesh: meshData.root,
        velocity: new THREE.Vector3(),
        angularVelocity: new THREE.Vector3(),
        isAirborne: false,
        mass: 1.0,
        width: 2.2,
        height: 1.45,
        length: 4.35,
        isDestroyed: false,
        isOnFire: false,
        fireTimer: 0
      };
    }

    // Setup Player
    const playerVehicleMesh = createCarMesh(0xd11111);
    const playerPhysics = createPhysicsObject(playerVehicleMesh);
    const carGroup = playerPhysics.mesh;
    scene.add(carGroup);
    
    const startPos = roadCurve.getPointAt(0);
    const startTangent = roadCurve.getTangentAt(0);
    carGroup.position.copy(startPos);
    carGroup.lookAt(startPos.clone().add(startTangent));

    // Setup AI Traffic
    const aiCars = [];
    const trafficColors = [0x1e66ff, 0xffa500, 0x777777, 0x00b359, 0x8a2be2];
    const NUM_AI_CARS = 16;

    for (let i = 0; i < NUM_AI_CARS; i++) {
      const color = trafficColors[i % trafficColors.length];
      const vehicleMesh = createCarMesh(color);
      const aiObj = createPhysicsObject(vehicleMesh);
      scene.add(aiObj.mesh);

      const progress = (i / NUM_AI_CARS);
      const laneSide = i % 2 === 0 ? 1 : -1;
      const laneOffset = (ROAD_WIDTH / 4) * laneSide;
      const baseSpeed = (0.0004 + Math.random() * 0.0003) * 0.2;

      aiCars.push({
        ...aiObj,
        progress: progress,
        targetSpeed: baseSpeed,
        currentSpeed: baseSpeed,
        laneOffset: laneOffset,
        direction: laneSide,
        isBraking: false,
        inCrashPhysics: false
      });
    }

    // --- Transmission & Controls ---
    const gearList = ['R', 'N', '1', '2', '3', '4', '5', '6', '7'];
    let currentGearIndex = 2;

    const gearRatios = {
      'R': { accel: -0.0030, maxSpeed: -0.40, isReverse: true },
      'N': { accel: 0, maxSpeed: 0, isNeutral: true },
      '1': { accel: 0.0065, maxSpeed: 0.35 },
      '2': { accel: 0.0050, maxSpeed: 0.60 },
      '3': { accel: 0.0038, maxSpeed: 0.90 },
      '4': { accel: 0.0028, maxSpeed: 1.20 },
      '5': { accel: 0.0020, maxSpeed: 1.50 },
      '6': { accel: 0.0014, maxSpeed: 1.75 },
      '7': { accel: 0.0009, maxSpeed: 2.00 }
    };

    let speed = 0;
    let currentSteerAngle = 0;
    let isSpinningOut = false;
    let spinoutTimer = 0;

    let activeSignal = 'OFF';
    let signalTimer = 0;

    const BRAKE_POWER = 0.035;
    const FRICTION = 0.993;
    const GRAVITY = -0.025;

    const keys = { w: false, s: false, a: false, d: false, shift: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 's' || e.key === 'S') keys.s = true;
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
      if (e.key === 'Shift') keys.shift = true;

      if (keys.shift && !isSpinningOut) {
        const oldGear = gearList[currentGearIndex];
        if (e.key === 'ArrowUp') {
          if (currentGearIndex < gearList.length - 1) currentGearIndex++;
        } else if (e.key === 'ArrowDown') {
          if (currentGearIndex > 0) currentGearIndex--;
        }

        const newGear = gearList[currentGearIndex];
        document.getElementById('gear-display').innerText = `GEAR: ${newGear}`;

        if ((oldGear === '6' || oldGear === '7') && (newGear === '1' || newGear === 'R') && Math.abs(speed) > 0.85) {
          triggerSpinout();
        }
      }

      if (!keys.shift) {
        if (e.key === 'ArrowLeft') {
          activeSignal = (activeSignal === 'LEFT') ? 'OFF' : 'LEFT';
        } else if (e.key === 'ArrowRight') {
          activeSignal = (activeSignal === 'RIGHT') ? 'OFF' : 'RIGHT';
        }
        document.getElementById('signals-display').innerText = `SIGNAL: ${activeSignal}`;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      if (e.key === 'Shift') keys.shift = false;
    });

    function triggerSpinout() {
      isSpinningOut = true;
      spinoutTimer = 120;
      document.getElementById('warning').style.display = 'block';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- High-Detail Vertex Mesh Deform Physics Solver ---
    function crumpleMeshVertexImpact(mesh, localImpactPoint, impactForce) {
      if (!mesh || !mesh.geometry) return;
      const pos = mesh.geometry.attributes.position;
      const radius = 1.2 * impactForce;

      for (let i = 0; i < pos.count; i++) {
        const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
        const dist = v.distanceTo(localImpactPoint);

        if (dist < radius) {
          const deformation = (1 - dist / radius) * 0.45 * impactForce;
          const pushVector = v.clone().sub(localImpactPoint).normalize().multiplyScalar(deformation);
          
          // Crumple inwards and add local surface jittering
          v.sub(pushVector);
          v.x += (Math.random() - 0.5) * 0.08 * impactForce;
          v.y += (Math.random() - 0.5) * 0.08 * impactForce;
          v.z += (Math.random() - 0.5) * 0.08 * impactForce;

          pos.setXYZ(i, v.x, v.y, v.z);
        }
      }
      pos.needsUpdate = true;
      mesh.geometry.computeVertexNormals();
    }

    // --- Hard Surface Ground Floor Rigid Body Solver ---
    function updatePhysicsBody(body) {
      body.mesh.position.add(body.velocity);

      // Floor Hitbox Enforcement
      if (body.mesh.position.y > FLOOR_Y || body.isAirborne) {
        body.velocity.y += GRAVITY;
      }

      if (body.mesh.position.y <= FLOOR_Y) {
        body.mesh.position.y = FLOOR_Y;
        body.velocity.y = 0;
        body.isAirborne = false;

        // Ground Friction
        body.velocity.x *= 0.88;
        body.velocity.z *= 0.88;
        body.angularVelocity.multiplyScalar(0.82);

        // Stabilize roll/pitch on floor contact
        body.mesh.rotation.x *= 0.75;
        body.mesh.rotation.z *= 0.75;
      } else {
        body.isAirborne = true;
      }

      body.mesh.rotation.x += body.angularVelocity.x;
      body.mesh.rotation.y += body.angularVelocity.y;
      body.mesh.rotation.z += body.angularVelocity.z;

      // Engine Fire Particle Processing
      if (body.isOnFire) {
        body.fireTimer++;
        body.vehicle.fireMesh.visible = true;
        body.vehicle.fireMesh.scale.setScalar(1.0 + Math.sin(body.fireTimer * 0.5) * 0.25);

        const enginePos = body.mesh.position.clone().add(new THREE.Vector3(0, 0.8, -1.2).applyEuler(body.mesh.rotation));
        emitSparks(enginePos, 5, 2.0);
      }
    }

    // --- Exact Oriented Bounding Box (OBB) Hitbox Detection ---
    function checkOBBCollision(bodyA, bodyB) {
      const posA = bodyA.mesh.position;
      const posB = bodyB.mesh.position;

      const dx = Math.abs(posA.x - posB.x);
      const dy = Math.abs(posA.y - posB.y);
      const dz = Math.abs(posA.z - posB.z);

      const halfW = (bodyA.width + bodyB.width) * 0.45;
      const halfH = (bodyA.height + bodyB.height) * 0.50;
      const halfL = (bodyA.length + bodyB.length) * 0.45;

      return (dx < halfW && dy < halfH && dz < halfL);
    }

    // --- Advanced Disintegration & Engine Explosion Mechanics ---
    function triggerVehicleDestruction(body, impactVelocity, impactPoint) {
      const p = body.vehicle.parts;
      const pos = body.mesh.position;
      const rot = body.mesh.rotation;
      const impactForce = Math.min(impactVelocity.length(), 2.0);

      // Crumple main body panel vertices around impact zone
      if (p.carBody) {
        const localImpact = p.carBody.worldToLocal(impactPoint.clone());
        crumpleMeshVertexImpact(p.carBody, localImpact, impactForce);
      }

      if (body.isDestroyed) return;
      body.isDestroyed = true;

      // Detach front bumper
      if (p.frontBumper.parent) {
        p.frontBumper.parent.remove(p.frontBumper);
        spawnDebrisPiece(p.frontBumper.geometry, p.frontBumper.material, 
          pos.clone().add(new THREE.Vector3(0, 0.35, -2.12).applyEuler(rot)), rot,
          impactVelocity.clone().add(new THREE.Vector3((Math.random()-0.5)*0.5, 0.2, -0.4)),
          new THREE.Vector3(0.2, 0.2, 0)
        );
      }

      // Detach cabin glass/roof on massive impacts
      if (p.cabin.parent && impactForce > 0.5) {
        p.cabin.parent.remove(p.cabin);
        spawnDebrisPiece(p.cabin.geometry, p.cabin.material,
          pos.clone().add(new THREE.Vector3(0, 1.15, -0.05).applyEuler(rot)), rot,
          impactVelocity.clone().add(new THREE.Vector3((Math.random()-0.5)*0.3, 0.4, 0.1)),
          new THREE.Vector3(0.1, 0.3, 0.1)
        );
      }

      // Detach wheels
      if (p.frontLeftWheel.parent) {
        p.frontLeftWheel.parent.remove(p.frontLeftWheel);
        const wheelChild = p.frontLeftWheel.children[0];
        spawnDebrisPiece(wheelChild.geometry, wheelChild.material,
          pos.clone().add(new THREE.Vector3(-1.08, 0.4, -1.25).applyEuler(rot)), rot,
          impactVelocity.clone().add(new THREE.Vector3(-0.4, 0.3, -0.2)),
          new THREE.Vector3(0.4, 0.1, 0.4)
        );
      }
    }

    function triggerEngineExplosion(victimBody, attackerVel) {
      victimBody.isOnFire = true;
      const explosionCenter = victimBody.mesh.position.clone().add(new THREE.Vector3(0, 0.6, -1.2).applyEuler(victimBody.mesh.rotation));

      emitSparks(explosionCenter, 180, 4.0);

      const distToPlayer = playerPhysics.mesh.position.distanceTo(explosionCenter);
      if (distToPlayer < 12.0) {
        const shockDir = new THREE.Vector3().subVectors(playerPhysics.mesh.position, explosionCenter).normalize();
        const shockPower = (12.0 - distToPlayer) * 0.08;
        
        playerPhysics.velocity.addScaledVector(shockDir, shockPower);
        playerPhysics.angularVelocity.y += (Math.random() - 0.5) * shockPower * 2.0;
        speed *= 0.2;
        triggerSpinout();
      }
    }

    // --- Precise Collision Reaction Solver ---
    function handleVehicleCollisions() {
      const pForward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      const playerVelVec = pForward.clone().multiplyScalar(speed).add(playerPhysics.velocity);

      aiCars.forEach(ai => {
        if (checkOBBCollision(playerPhysics, ai)) {
          const collisionNormal = new THREE.Vector3().subVectors(playerPhysics.mesh.position, ai.mesh.position).normalize();
          const impactPoint = ai.mesh.position.clone().add(collisionNormal.clone().multiplyScalar(1.5));

          const aiForward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), ai.mesh.rotation.y);
          const aiSpeedVal = ai.inCrashPhysics ? 0 : ai.currentSpeed * 40;
          const aiVelVec = aiForward.clone().multiplyScalar(aiSpeedVal).add(ai.velocity);

          const relativeVelocity = new THREE.Vector3().subVectors(playerVelVec, aiVelVec);
          const impactForce = relativeVelocity.length();

          // Physical Separation
          playerPhysics.mesh.position.addScaledVector(collisionNormal, 0.15);
          ai.mesh.position.addScaledVector(collisionNormal, -0.15);

          if (impactForce < 0.12) {
            emitSparks(impactPoint, 8, 0.8);
          } else if (impactForce < 0.50) {
            emitSparks(impactPoint, 35, 1.5);
            
            const impulse = collisionNormal.clone().multiplyScalar(impactForce * 0.5);
            playerPhysics.velocity.add(impulse);
            ai.velocity.sub(impulse);

            playerPhysics.angularVelocity.y += (Math.random() - 0.5) * 0.2;
            ai.angularVelocity.y += (Math.random() - 0.5) * 0.2;

            speed *= 0.6;
            ai.inCrashPhysics = true;

            triggerVehicleDestruction(ai, aiVelVec, impactPoint);
            triggerVehicleDestruction(playerPhysics, playerVelVec, impactPoint);
          } else {
            // High-Speed Crash: Deform vertex mesh, dismantle parts & explode engine
            emitSparks(impactPoint, 120, 3.2);

            playerPhysics.velocity.set(0, 0, 0); 
            ai.velocity.copy(collisionNormal.clone().multiplyScalar(-impactForce * 0.6));
            ai.angularVelocity.y += (Math.random() - 0.5) * 0.6;

            speed = -speed * 0.15;
            ai.inCrashPhysics = true;

            triggerVehicleDestruction(playerPhysics, playerVelVec, impactPoint);
            triggerVehicleDestruction(ai, aiVelVec, impactPoint);

            const impactLocalAngle = collisionNormal.dot(aiForward);
            if (impactLocalAngle > 0.45 && !ai.isOnFire) {
              triggerEngineExplosion(ai, playerVelVec);
            }

            triggerSpinout();
          }
        }
      });
    }

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const currentGearKey = gearList[currentGearIndex];
      const activeGear = gearRatios[currentGearKey];
      let playerIsBraking = false;

      // Handle Player Input Physics
      if (isSpinningOut) {
        speed *= 0.95;
        spinoutTimer--;
        if (spinoutTimer <= 0) {
          isSpinningOut = false;
          document.getElementById('warning').style.display = 'none';
        }
      } else {
        if (keys.w) {
          if (!keys.shift && !activeGear.isNeutral) {
            if (activeGear.isReverse) {
              speed = Math.max(speed + activeGear.accel, activeGear.maxSpeed);
            } else {
              speed = Math.min(speed + activeGear.accel, activeGear.maxSpeed);
            }
          }
        } else {
          speed *= FRICTION;
        }

        if (keys.s) {
          playerIsBraking = true;
          if (speed > 0) speed = Math.max(0, speed - BRAKE_POWER);
          else if (speed < 0) speed = Math.min(0, speed + BRAKE_POWER);
        }

        if (Math.abs(speed) < 0.0005) speed = 0;

        const absSpeed = Math.abs(speed);
        const speedRatio = Math.min(absSpeed / 2.00, 1.0);
        const maxSteerLimit = 0.065 * (1.0 - speedRatio * 0.82); 
        const steerBuildRate = 0.0008 + (1.0 - speedRatio) * 0.0006;

        if (keys.a) {
          currentSteerAngle = Math.min(currentSteerAngle + steerBuildRate, maxSteerLimit);
        } else if (keys.d) {
          currentSteerAngle = Math.max(currentSteerAngle - steerBuildRate, -maxSteerLimit);
        } else {
          currentSteerAngle += (0 - currentSteerAngle) * (0.04 + (absSpeed * 0.12));
        }

        if (Math.abs(speed) > 0.002 && !playerPhysics.isAirborne) {
          const turnDirection = speed >= 0 ? 1 : -1;
          carGroup.rotation.y += currentSteerAngle * turnDirection;
        }
      }

      // Drive Forward Translation
      if (!playerPhysics.isAirborne) {
        const forwardVector = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
        carGroup.position.addScaledVector(forwardVector, speed);
      }

      // Physics Rigid Body Update
      updatePhysicsBody(playerPhysics);
      updateSparks();
      updateDebris();

      // Solvers
      handleVehicleCollisions();

      // UI Lights & Visuals
      const activeBrakeMaterial = playerIsBraking ? playerVehicleMesh.activeMat : playerVehicleMesh.idleMat;
      playerVehicleMesh.brakeLights.forEach(light => { if(light.parent) light.material = activeBrakeMaterial; });

      signalTimer += 0.08;
      const isBlinking = Math.sin(signalTimer * 8) > 0;
      playerVehicleMesh.signalMatLeft.visible = (activeSignal === 'LEFT') && isBlinking;
      playerVehicleMesh.signalMatRight.visible = (activeSignal === 'RIGHT') && isBlinking;

      playerVehicleMesh.frontPivots[0].rotation.y = currentSteerAngle * 9;
      playerVehicleMesh.frontPivots[1].rotation.y = currentSteerAngle * 9;

      const targetRoll = -currentSteerAngle * (speed * 1.5);
      playerVehicleMesh.body.rotation.z += (targetRoll - playerVehicleMesh.body.rotation.z) * 0.12;

      // Update AI Traffic
      aiCars.forEach(ai => {
        if (!ai.inCrashPhysics) {
          ai.progress += ai.currentSpeed * ai.direction;
          if (ai.progress > 1) ai.progress -= 1;
          if (ai.progress < 0) ai.progress += 1;

          const pos = roadCurve.getPointAt(ai.progress);
          const tangent = roadCurve.getTangentAt(ai.progress);
          const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

          ai.mesh.position.copy(pos).addScaledVector(normal, ai.laneOffset);
          const lookTarget = pos.clone().addScaledVector(tangent, ai.direction).addScaledVector(normal, ai.laneOffset);
          ai.mesh.lookAt(lookTarget);

          const distToPlayer = ai.mesh.position.distanceTo(carGroup.position);
          if (distToPlayer < 18) {
            ai.currentSpeed = Math.max(0, ai.currentSpeed - 0.000002);
            ai.isBraking = true;
          } else {
            ai.currentSpeed = Math.min(ai.targetSpeed, ai.currentSpeed + 0.000001);
            ai.isBraking = false;
          }
        } else {
          updatePhysicsBody(ai);
        }

        const aiBrakeMat = ai.isBraking ? ai.vehicle.activeMat : ai.vehicle.idleMat;
        ai.vehicle.brakeLights.forEach(light => { if(light.parent) light.material = aiBrakeMat; });
      });

      // Camera Tracking
      grass.position.x = carGroup.position.x;
      grass.position.z = carGroup.position.z;

      const cameraOffset = new THREE.Vector3(0, 3.5, 8).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      camera.position.copy(carGroup.position).add(cameraOffset);
      camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

      const mph = Math.round(Math.abs(speed) * 80);
      document.getElementById('speedometer').innerText = `${mph} MPH`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
