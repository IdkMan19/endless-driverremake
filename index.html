<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Driving Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #speedometer {
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 5px;
    }
    #gear-display {
      font-size: 20px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 3px;
    }
    #signals-display {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 5px;
    }
    #warning {
      font-size: 18px;
      font-weight: bold;
      color: #ff3333;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin:0; font-size: 24px;">Physics Driving Simulator</h1>
    <p style="margin:5px 0 0 0;"><b>W</b> = Throttle | <b>S</b> = Brake | <b>A / D</b> = Steer</p>
    <p style="margin:2px 0 0 0;"><b>Shift + Up/Down</b> = Gear Shift | <b>Left/Right Arrows</b> = Turn Signals</p>
    <div id="speedometer">0 MPH</div>
    <div id="gear-display">GEAR: 1</div>
    <div id="signals-display">SIGNAL: OFF</div>
    <div id="warning">MONEY SHIFT! SPINOUT!</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- Scene & Renderer Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // --- Hard Surface Ground Mesh (Solid Floor Hitbox) ---
    const GROUND_LEVEL = 0.0;
    const grassGeo = new THREE.PlaneGeometry(3000, 3000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = GROUND_LEVEL;
    scene.add(grass);

    // --- Road Generation ---
    const ROAD_WIDTH = 18;
    const NUM_POINTS = 300;
    const pathPoints = [];

    const radiusX = 600 + Math.random() * 300;
    const radiusZ = 600 + Math.random() * 300;

    for (let i = 0; i < NUM_POINTS; i++) {
      const angle = (i / NUM_POINTS) * Math.PI * 2;
      const wave = Math.sin(angle * 5) * 40 + Math.cos(angle * 3) * 30;
      const x = Math.cos(angle) * (radiusX + wave);
      const z = Math.sin(angle) * (radiusZ + wave);
      pathPoints.push(new THREE.Vector3(x, 0, z));
    }

    const roadCurve = new THREE.CatmullRomCurve3(pathPoints, true);
    const curvePoints = roadCurve.getSpacedPoints(1200);

    const roadVertices = [];
    const roadIndices = [];

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const leftPt = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2);
      const rightPt = pt.clone().addScaledVector(normal, -ROAD_WIDTH / 2);

      roadVertices.push(leftPt.x, GROUND_LEVEL + 0.01, leftPt.z);
      roadVertices.push(rightPt.x, GROUND_LEVEL + 0.01, rightPt.z);

      if (i < curvePoints.length - 1) {
        const base = i * 2;
        roadIndices.push(base, base + 1, base + 2);
        roadIndices.push(base + 1, base + 3, base + 2);
      }
    }
    const lastBase = (curvePoints.length - 1) * 2;
    roadIndices.push(lastBase, lastBase + 1, 0);
    roadIndices.push(lastBase + 1, 1, 0);

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222225, side: THREE.DoubleSide });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    scene.add(roadMesh);

    // --- Markings & Trees ---
    const lineMatYellow = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
    const lineMatWhite = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });

    const dashGeo = new THREE.PlaneGeometry(0.35, 3);
    dashGeo.rotateX(-Math.PI / 2);
    const edgeGeo = new THREE.PlaneGeometry(0.35, 3.5);
    edgeGeo.rotateX(-Math.PI / 2);

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const nextPt = curvePoints[(i + 1) % curvePoints.length];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      if (i % 3 === 0) {
        const centerDash = new THREE.Mesh(dashGeo, lineMatYellow);
        centerDash.position.set(pt.x, GROUND_LEVEL + 0.02, pt.z);
        centerDash.lookAt(nextPt.x, GROUND_LEVEL + 0.02, nextPt.z);
        scene.add(centerDash);
      }

      const leftPos = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      const leftNext = nextPt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      const leftEdge = new THREE.Mesh(edgeGeo, lineMatWhite);
      leftEdge.position.set(leftPos.x, GROUND_LEVEL + 0.02, leftPos.z);
      leftEdge.lookAt(leftNext.x, GROUND_LEVEL + 0.02, leftNext.z);
      scene.add(leftEdge);

      const rightPos = pt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      const rightNext = nextPt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      const rightEdge = new THREE.Mesh(edgeGeo, lineMatWhite);
      rightEdge.position.set(rightPos.x, GROUND_LEVEL + 0.02, rightPos.z);
      rightEdge.lookAt(rightNext.x, GROUND_LEVEL + 0.02, rightNext.z);
      scene.add(rightEdge);
    }

    const treeGeo = new THREE.ConeGeometry(2.5, 7, 5);
    const treeMat = new THREE.MeshLambertMaterial({ color: 0x1b5e20 });

    for (let i = 0; i < curvePoints.length; i += 4) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const treeL = new THREE.Mesh(treeGeo, treeMat);
      treeL.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 + 6 + Math.random() * 18);
      treeL.position.y = GROUND_LEVEL + 3.5;
      scene.add(treeL);

      const treeR = new THREE.Mesh(treeGeo, treeMat);
      treeR.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 + 6 + Math.random() * 18));
      treeR.position.y = GROUND_LEVEL + 3.5;
      scene.add(treeR);
    }

    // --- Debris Management System (Parts Breaking Off) ---
    const worldDebris = [];

    function spawnDebrisPiece(geometry, material, worldMatrix, velocityVector) {
      const mesh = new THREE.Mesh(geometry.clone(), material.clone());
      mesh.applyMatrix4(worldMatrix);
      scene.add(mesh);

      worldDebris.push({
        mesh: mesh,
        velocity: velocityVector.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.2, Math.random() * 0.15 + 0.05, (Math.random() - 0.5) * 0.2)),
        angularVelocity: new THREE.Vector3((Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2),
        life: 300
      });
    }

    function updateDebris() {
      for (let i = worldDebris.length - 1; i >= 0; i--) {
        const item = worldDebris[i];
        item.mesh.position.add(item.velocity);
        
        // Ground Interaction with Hard Floor Hitbox
        if (item.mesh.position.y > GROUND_LEVEL + 0.1) {
          item.velocity.y -= 0.01; // Gravity
        } else {
          item.mesh.position.y = GROUND_LEVEL + 0.1;
          item.velocity.x *= 0.85; // Friction
          item.velocity.z *= 0.85;
          item.velocity.y = -item.velocity.y * 0.2; // Floor bounce
          item.angularVelocity.multiplyScalar(0.85);
        }

        item.mesh.rotation.x += item.angularVelocity.x;
        item.mesh.rotation.y += item.angularVelocity.y;
        item.mesh.rotation.z += item.angularVelocity.z;

        item.life--;
        if (item.life <= 0) {
          scene.remove(item.mesh);
          worldDebris.splice(i, 1);
        }
      }
    }

    // --- Particle Effects (Sparks & Explosions) ---
    const sparkCount = 200;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(sparkCount * 3);
    const sparkVelocities = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPositions[i * 3] = 0;
      sparkPositions[i * 3 + 1] = -100;
      sparkPositions[i * 3 + 2] = 0;
      sparkVelocities.push(new THREE.Vector3());
    }

    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    const sparkMat = new THREE.PointsMaterial({ color: 0xffaa11, size: 0.35, transparent: true, opacity: 0.95 });
    const sparkParticles = new THREE.Points(sparkGeo, sparkMat);
    scene.add(sparkParticles);

    function emitSparks(location, count) {
      const positions = sparkParticles.geometry.attributes.position.array;
      for (let i = 0; i < count; i++) {
        const idx = Math.floor(Math.random() * sparkCount);
        positions[idx * 3] = location.x;
        positions[idx * 3 + 1] = location.y;
        positions[idx * 3 + 2] = location.z;
        
        sparkVelocities[idx].set(
          (Math.random() - 0.5) * 0.8,
          Math.random() * 0.4 + 0.1,
          (Math.random() - 0.5) * 0.8
        );
      }
      sparkParticles.geometry.attributes.position.needsUpdate = true;
    }

    // Fire Explosion System
    const fireCount = 150;
    const fireGeo = new THREE.BufferGeometry();
    const firePositions = new Float32Array(fireCount * 3);
    const fireVelocities = [];

    for (let i = 0; i < fireCount; i++) {
      firePositions[i * 3] = 0;
      firePositions[i * 3 + 1] = -100;
      firePositions[i * 3 + 2] = 0;
      fireVelocities.push(new THREE.Vector3());
    }

    fireGeo.setAttribute('position', new THREE.BufferAttribute(firePositions, 3));
    const fireMat = new THREE.PointsMaterial({ color: 0xff2200, size: 0.8, transparent: true, opacity: 0.85 });
    const fireParticles = new THREE.Points(fireGeo, fireMat);
    scene.add(fireParticles);

    function triggerEngineExplosion(location) {
      const positions = fireParticles.geometry.attributes.position.array;
      for (let i = 0; i < fireCount; i++) {
        positions[i * 3] = location.x;
        positions[i * 3 + 1] = location.y;
        positions[i * 3 + 2] = location.z;
        
        fireVelocities[i].set(
          (Math.random() - 0.5) * 1.5,
          Math.random() * 1.2 + 0.3,
          (Math.random() - 0.5) * 1.5
        );
      }
      fireParticles.geometry.attributes.position.needsUpdate = true;
    }

    function updateParticles() {
      // Sparks
      const sPos = sparkParticles.geometry.attributes.position.array;
      for (let i = 0; i < sparkCount; i++) {
        if (sPos[i * 3 + 1] > -50) {
          sPos[i * 3] += sparkVelocities[i].x;
          sPos[i * 3 + 1] += sparkVelocities[i].y;
          sPos[i * 3 + 2] += sparkVelocities[i].z;
          sparkVelocities[i].y -= 0.02; // Gravity

          if (sPos[i * 3 + 1] <= GROUND_LEVEL) {
            sPos[i * 3 + 1] = -100;
          }
        }
      }
      sparkParticles.geometry.attributes.position.needsUpdate = true;

      // Fire
      const fPos = fireParticles.geometry.attributes.position.array;
      for (let i = 0; i < fireCount; i++) {
        if (fPos[i * 3 + 1] > -50) {
          fPos[i * 3] += fireVelocities[i].x;
          fPos[i * 3 + 1] += fireVelocities[i].y;
          fPos[i * 3 + 2] += fireVelocities[i].z;
          fireVelocities[i].multiplyScalar(0.96);

          if (fPos[i * 3 + 1] <= GROUND_LEVEL || fireVelocities[i].length() < 0.01) {
            fPos[i * 3 + 1] = -100;
          }
        }
      }
      fireParticles.geometry.attributes.position.needsUpdate = true;
    }

    // --- Helper to Build Modular Car Mesh with Breakable Parts ---
    function createCarMesh(colorHex) {
      const carGroup = new THREE.Group();
      const visualBody = new THREE.Group();
      carGroup.add(visualBody);

      const carBodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
      const darkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
      const bumperMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
      const glassMat = new THREE.MeshPhongMaterial({ color: 0x223344, shininess: 80, transparent: true, opacity: 0.85 });
      const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
      const taillightIdleMat = new THREE.MeshBasicMaterial({ color: 0x550000 });
      const brakeLightActiveMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      
      const signalMatLeft = new THREE.MeshBasicMaterial({ color: 0xffaa00, visible: false });
      const signalMatRight = new THREE.MeshBasicMaterial({ color: 0xffaa00, visible: false });

      // Chassis
      const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 4.0), carBodyMat);
      carBody.position.y = 0.55;
      visualBody.add(carBody);

      // Cabin (Breakable)
      const cabinGeo = new THREE.BoxGeometry(1.65, 0.6, 2.1);
      const cabin = new THREE.Mesh(cabinGeo, glassMat);
      cabin.position.set(0, 1.15, -0.1);
      visualBody.add(cabin);

      // Bumpers (Breakable)
      const frontBumperGeo = new THREE.BoxGeometry(2.1, 0.3, 0.25);
      const frontBumper = new THREE.Mesh(frontBumperGeo, bumperMat);
      frontBumper.position.set(0, 0.35, -2.05);
      visualBody.add(frontBumper);

      const rearBumperGeo = new THREE.BoxGeometry(2.1, 0.3, 0.25);
      const rearBumper = new THREE.Mesh(rearBumperGeo, bumperMat);
      rearBumper.position.set(0, 0.35, 2.05);
      visualBody.add(rearBumper);

      // Lights & Signals
      const headlightGeo = new THREE.BoxGeometry(0.4, 0.18, 0.08);
      const headlightL = new THREE.Mesh(headlightGeo, headlightMat);
      headlightL.position.set(-0.65, 0.65, -2.02);
      visualBody.add(headlightL);

      const headlightR = new THREE.Mesh(headlightGeo, headlightMat);
      headlightR.position.set(0.65, 0.65, -2.02);
      visualBody.add(headlightR);

      const taillightGeo = new THREE.BoxGeometry(0.4, 0.18, 0.08);
      const taillightL = new THREE.Mesh(taillightGeo, taillightIdleMat);
      taillightL.position.set(-0.65, 0.65, 2.02);
      visualBody.add(taillightL);

      const taillightR = new THREE.Mesh(taillightGeo, taillightIdleMat);
      taillightR.position.set(0.65, 0.65, 2.02);
      visualBody.add(taillightR);

      const signalGeo = new THREE.BoxGeometry(0.2, 0.15, 0.1);
      const signalFL = new THREE.Mesh(signalGeo, signalMatLeft);
      signalFL.position.set(-0.92, 0.65, -2.02);
      visualBody.add(signalFL);

      const signalFR = new THREE.Mesh(signalGeo, signalMatRight);
      signalFR.position.set(0.92, 0.65, -2.02);
      visualBody.add(signalFR);

      // Wheels Assembly (Breakable)
      const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
      wheelGeo.rotateZ(Math.PI / 2);

      function buildWheel() {
        return new THREE.Mesh(wheelGeo, darkMat);
      }

      const wheels = [
        buildWheel(), buildWheel(), buildWheel(), buildWheel()
      ];

      wheels[0].position.set(-1.05, 0.4, -1.2);
      wheels[1].position.set(1.05, 0.4, -1.2);
      wheels[2].position.set(-1.05, 0.4, 1.2);
      wheels[3].position.set(1.05, 0.4, 1.2);

      wheels.forEach(w => visualBody.add(w));

      return {
        root: carGroup,
        body: visualBody,
        parts: {
          frontBumper: { mesh: frontBumper, geo: frontBumperGeo, mat: bumperMat },
          rearBumper: { mesh: rearBumper, geo: rearBumperGeo, mat: bumperMat },
          cabin: { mesh: cabin, geo: cabinGeo, mat: glassMat },
          wheels: wheels.map(w => ({ mesh: w, geo: wheelGeo, mat: darkMat }))
        },
        brakeLights: [taillightL, taillightR],
        idleMat: taillightIdleMat,
        activeMat: brakeLightActiveMat,
        signalMatLeft: signalMatLeft,
        signalMatRight: signalMatRight
      };
    }

    // --- Entity Creation ---
    function createEntity(meshData) {
      return {
        meshData: meshData,
        mesh: meshData.root,
        velocity: new THREE.Vector3(),
        width: 2.1,
        height: 1.4,
        length: 4.2,
        isEngineOnFire: false,
        isDestroyed: false,
        hitbox: new THREE.Box3()
      };
    }

    const playerMesh = createCarMesh(0xcc0000);
    const playerEntity = createEntity(playerMesh);
    scene.add(playerEntity.mesh);

    const startPos = roadCurve.getPointAt(0);
    const startTangent = roadCurve.getTangentAt(0);
    playerEntity.mesh.position.copy(startPos);
    playerEntity.mesh.lookAt(startPos.clone().add(startTangent));

    const aiCars = [];
    const trafficColors = [0x0055ff, 0xffaa00, 0x888888, 0x00aa44, 0x9900cc];
    const NUM_AI_CARS = 14;

    for (let i = 0; i < NUM_AI_CARS; i++) {
      const color = trafficColors[i % trafficColors.length];
      const vehicleMesh = createCarMesh(color);
      const aiObj = createEntity(vehicleMesh);
      scene.add(aiObj.mesh);

      const progress = (i / NUM_AI_CARS);
      const laneSide = i % 2 === 0 ? 1 : -1;
      const laneOffset = (ROAD_WIDTH / 4) * laneSide;
      const baseSpeed = (0.0004 + Math.random() * 0.0003) * 0.2;

      aiCars.push({
        ...aiObj,
        progress: progress,
        targetSpeed: baseSpeed,
        currentSpeed: baseSpeed,
        laneOffset: laneOffset,
        direction: laneSide,
        isBraking: false,
        inCrashPhysics: false
      });
    }

    // --- Exact Oriented Bounding Box (OBB) & AABB Hitbox Helper ---
    function updateEntityHitbox(entity) {
      entity.hitbox.setFromObject(entity.mesh);
    }

    function checkExactBoundingCollision(entityA, entityB) {
      updateEntityHitbox(entityA);
      updateEntityHitbox(entityB);
      return entityA.hitbox.intersectsBox(entityB.hitbox);
    }

    // --- Transmission & Controls ---
    const gearList = ['R', 'N', '1', '2', '3', '4', '5', '6', '7'];
    let currentGearIndex = 2;

    const gearRatios = {
      'R': { accel: -0.0030, maxSpeed: -0.40, isReverse: true },
      'N': { accel: 0, maxSpeed: 0, isNeutral: true },
      '1': { accel: 0.0065, maxSpeed: 0.35 },
      '2': { accel: 0.0050, maxSpeed: 0.60 },
      '3': { accel: 0.0038, maxSpeed: 0.90 },
      '4': { accel: 0.0028, maxSpeed: 1.20 },
      '5': { accel: 0.0020, maxSpeed: 1.50 },
      '6': { accel: 0.0014, maxSpeed: 1.75 },
      '7': { accel: 0.0009, maxSpeed: 2.00 }
    };

    let speed = 0;
    let currentSteerAngle = 0;
    let isSpinningOut = false;
    let spinoutTimer = 0;

    let activeSignal = 'OFF';
    let signalTimer = 0;

    const BRAKE_POWER = 0.035;
    const FRICTION = 0.993;

    const keys = { w: false, s: false, a: false, d: false, shift: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 's' || e.key === 'S') keys.s = true;
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
      if (e.key === 'Shift') keys.shift = true;

      if (keys.shift && !isSpinningOut) {
        const oldGear = gearList[currentGearIndex];
        if (e.key === 'ArrowUp') {
          if (currentGearIndex < gearList.length - 1) currentGearIndex++;
        } else if (e.key === 'ArrowDown') {
          if (currentGearIndex > 0) currentGearIndex--;
        }

        const newGear = gearList[currentGearIndex];
        document.getElementById('gear-display').innerText = `GEAR: ${newGear}`;

        if ((oldGear === '6' || oldGear === '7') && (newGear === '1' || newGear === 'R') && Math.abs(speed) > 0.85) {
          triggerSpinout();
        }
      }

      if (!keys.shift) {
        if (e.key === 'ArrowLeft') {
          activeSignal = (activeSignal === 'LEFT') ? 'OFF' : 'LEFT';
        } else if (e.key === 'ArrowRight') {
          activeSignal = (activeSignal === 'RIGHT') ? 'OFF' : 'RIGHT';
        }
        document.getElementById('signals-display').innerText = `SIGNAL: ${activeSignal}`;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      if (e.key === 'Shift') keys.shift = false;
    });

    function triggerSpinout() {
      isSpinningOut = true;
      spinoutTimer = 120;
      document.getElementById('warning').style.display = 'block';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Break Parts Helper ---
    function dismantleVehicleParts(entity, impactForce, impactPoint) {
      const parts = entity.meshData.parts;
      const matrix = entity.mesh.matrixWorld;

      if (impactForce > 0.35 && parts.frontBumper.mesh.parent) {
        parts.frontBumper.mesh.parent.remove(parts.frontBumper.mesh);
        spawnDebrisPiece(parts.frontBumper.geo, parts.frontBumper.mat, matrix, entity.velocity);
      }
      if (impactForce > 0.50 && parts.rearBumper.mesh.parent) {
        parts.rearBumper.mesh.parent.remove(parts.rearBumper.mesh);
        spawnDebrisPiece(parts.rearBumper.geo, parts.rearBumper.mat, matrix, entity.velocity);
      }
      if (impactForce > 0.70 && parts.cabin.mesh.parent) {
        parts.cabin.mesh.parent.remove(parts.cabin.mesh);
        spawnDebrisPiece(parts.cabin.geo, parts.cabin.mat, matrix, entity.velocity);
      }
      if (impactForce > 0.85) {
        parts.wheels.forEach(w => {
          if (w.mesh.parent) {
            w.mesh.parent.remove(w.mesh);
            spawnDebrisPiece(w.geo, w.mat, matrix, entity.velocity);
          }
        });
      }
    }

    // --- High-Speed Engine Explosion & Collision System ---
    function resolveCollisions() {
      const pPos = playerEntity.mesh.position;
      const pForward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerEntity.mesh.rotation.y);
      const playerVelVec = pForward.clone().multiplyScalar(speed).add(playerEntity.velocity);

      aiCars.forEach(ai => {
        if (checkExactBoundingCollision(playerEntity, ai)) {
          const aiPos = ai.mesh.position;
          const distVec = new THREE.Vector3().subVectors(pPos, aiPos);
          const collisionNormal = distVec.clone().normalize();
          const impactPoint = aiPos.clone().add(distVec.clone().multiplyScalar(0.5));

          const aiForward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), ai.mesh.rotation.y);
          const aiSpeedVal = ai.inCrashPhysics ? 0 : ai.currentSpeed * 40;
          const aiVelVec = aiForward.clone().multiplyScalar(aiSpeedVal).add(ai.velocity);

          const relativeVelocity = new THREE.Vector3().subVectors(playerVelVec, aiVelVec);
          const impactForce = relativeVelocity.length();

          // Hard Floor Enforcement (Zero out glitchy airborne clipping)
          playerEntity.mesh.position.y = GROUND_LEVEL;
          ai.mesh.position.y = GROUND_LEVEL;

          // Push back
          playerEntity.mesh.position.addScaledVector(collisionNormal, 0.15);
          ai.mesh.position.addScaledVector(collisionNormal, -0.15);

          if (impactForce < 0.15) {
            // Minor scratch
            emitSparks(impactPoint, 8);
          } else if (impactForce < 0.60) {
            // Moderate skid & part detachment
            emitSparks(impactPoint, 30);
            dismantleVehicleParts(ai, impactForce, impactPoint);
            dismantleVehicleParts(playerEntity, impactForce, impactPoint);

            speed *= 0.3;
            ai.velocity.addScaledVector(collisionNormal, -impactForce * 0.4);
            ai.inCrashPhysics = true;
          } else {
            // High-Speed Destruction & Engine Fire Explosion
            emitSparks(impactPoint, 60);
            dismantleVehicleParts(ai, impactForce, impactPoint);
            dismantleVehicleParts(playerEntity, impactForce, impactPoint);

            // Angle Check for Front Engine Impact (Hitting engine bay)
            const angleToEngine = pForward.dot(aiForward);
            if (angleToEngine < -0.4 && Math.abs(speed) > 0.8) {
              // Engine explodes!
              ai.isEngineOnFire = true;
              triggerEngineExplosion(impactPoint);

              // Explosive blast wave affects player car
              const blastForce = collisionNormal.clone().multiplyScalar(0.85);
              playerEntity.velocity.add(blastForce);
              speed = -speed * 0.4;
              triggerSpinout();
            } else {
              speed = -speed * 0.2;
            }

            ai.velocity.addScaledVector(collisionNormal, -impactForce * 0.7);
            ai.inCrashPhysics = true;
          }
        }
      });
    }

    // --- Main Physics Loop with Sub-stepping (Anti-Glitch) ---
    function animate() {
      requestAnimationFrame(animate);

      // Fixed Sub-stepping for physics stability
      const SUB_STEPS = 3;
      for (let step = 0; step < SUB_STEPS; step++) {

        // Ground constraint box enforcement
        if (playerEntity.mesh.position.y !== GROUND_LEVEL) {
          playerEntity.mesh.position.y = GROUND_LEVEL;
          playerEntity.velocity.y = 0;
        }

        // Apply velocities on floor
        playerEntity.mesh.position.addScaledVector(playerEntity.velocity, 1 / SUB_STEPS);
        playerEntity.velocity.multiplyScalar(Math.pow(0.92, 1 / SUB_STEPS));

        aiCars.forEach(ai => {
          if (ai.mesh.position.y !== GROUND_LEVEL) {
            ai.mesh.position.y = GROUND_LEVEL;
            ai.velocity.y = 0;
          }

          if (ai.inCrashPhysics) {
            ai.mesh.position.addScaledVector(ai.velocity, 1 / SUB_STEPS);
            ai.velocity.multiplyScalar(Math.pow(0.92, 1 / SUB_STEPS));
            ai.mesh.rotation.y += 0.05;
          }

          if (ai.isEngineOnFire) {
            triggerEngineExplosion(ai.mesh.position.clone().add(new THREE.Vector3(0, 0.8, -1.0)));
          }
        });

        resolveCollisions();
      }

      // Input logic
      const currentGearKey = gearList[currentGearIndex];
      const activeGear = gearRatios[currentGearKey];
      let playerIsBraking = false;

      if (isSpinningOut) {
        playerEntity.mesh.rotation.y += 0.15;
        speed *= 0.96;
        spinoutTimer--;
        if (spinoutTimer <= 0) {
          isSpinningOut = false;
          document.getElementById('warning').style.display = 'none';
        }
      } else {
        if (keys.w) {
          if (!keys.shift && !activeGear.isNeutral) {
            if (activeGear.isReverse) {
              speed = Math.max(speed + activeGear.accel, activeGear.maxSpeed);
            } else {
              speed = Math.min(speed + activeGear.accel, activeGear.maxSpeed);
            }
          }
        } else {
          speed *= FRICTION;
        }

        if (keys.s) {
          playerIsBraking = true;
          if (speed > 0) speed = Math.max(0, speed - BRAKE_POWER);
          else if (speed < 0) speed = Math.min(0, speed + BRAKE_POWER);
        }

        if (Math.abs(speed) < 0.0005) speed = 0;

        const absSpeed = Math.abs(speed);
        const speedRatio = Math.min(absSpeed / 2.00, 1.0);
        const maxSteerLimit = 0.065 * (1.0 - speedRatio * 0.82); 
        const steerBuildRate = 0.0008 + (1.0 - speedRatio) * 0.0006;

        if (keys.a) {
          currentSteerAngle = Math.min(currentSteerAngle + steerBuildRate, maxSteerLimit);
        } else if (keys.d) {
          currentSteerAngle = Math.max(currentSteerAngle - steerBuildRate, -maxSteerLimit);
        } else {
          currentSteerAngle += (0 - currentSteerAngle) * (0.04 + (absSpeed * 0.12));
        }

        if (Math.abs(speed) > 0.002) {
          const turnDirection = speed >= 0 ? 1 : -1;
          playerEntity.mesh.rotation.y += currentSteerAngle * turnDirection;
        }
      }

      const forwardVector = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerEntity.mesh.rotation.y);
      playerEntity.mesh.position.addScaledVector(forwardVector, speed);

      // AI Logic
      aiCars.forEach(ai => {
        if (!ai.inCrashPhysics) {
          ai.progress += ai.currentSpeed * ai.direction;
          if (ai.progress > 1) ai.progress -= 1;
          if (ai.progress < 0) ai.progress += 1;

          const pos = roadCurve.getPointAt(ai.progress);
          const tangent = roadCurve.getTangentAt(ai.progress);
          const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

          ai.mesh.position.copy(pos).addScaledVector(normal, ai.laneOffset);
          ai.mesh.position.y = GROUND_LEVEL;
          const lookTarget = pos.clone().addScaledVector(tangent, ai.direction).addScaledVector(normal, ai.laneOffset);
          ai.mesh.lookAt(lookTarget);

          const distToPlayer = ai.mesh.position.distanceTo(playerEntity.mesh.position);
          if (distToPlayer < 18) {
            ai.currentSpeed = Math.max(0, ai.currentSpeed - 0.000002);
            ai.isBraking = true;
          } else {
            ai.currentSpeed = Math.min(ai.targetSpeed, ai.currentSpeed + 0.000001);
            ai.isBraking = false;
          }
        }

        const aiBrakeMat = ai.isBraking ? ai.meshData.activeMat : ai.meshData.idleMat;
        ai.meshData.brakeLights.forEach(light => light.material = aiBrakeMat);
      });

      // Updates
      updateDebris();
      updateParticles();

      // UI & Visuals
      const activeBrakeMaterial = playerIsBraking ? playerMesh.activeMat : playerMesh.idleMat;
      playerMesh.brakeLights.forEach(light => light.material = activeBrakeMaterial);

      signalTimer += 0.08;
      const isBlinking = Math.sin(signalTimer * 8) > 0;
      playerMesh.signalMatLeft.visible = (activeSignal === 'LEFT') && isBlinking;
      playerMesh.signalMatRight.visible = (activeSignal === 'RIGHT') && isBlinking;

      grass.position.x = playerEntity.mesh.position.x;
      grass.position.z = playerEntity.mesh.position.z;

      const cameraOffset = new THREE.Vector3(0, 3.5, 8).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerEntity.mesh.rotation.y);
      camera.position.copy(playerEntity.mesh.position).add(cameraOffset);
      camera.lookAt(playerEntity.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

      const mph = Math.round(Math.abs(speed) * 80);
      document.getElementById('speedometer').innerText = `${mph} MPH`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
