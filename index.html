<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Driving Simulator - Advanced Destruction</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #speedometer {
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 5px;
    }
    #gear-display {
      font-size: 20px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 3px;
    }
    #signals-display {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 5px;
    }
    #warning {
      font-size: 18px;
      font-weight: bold;
      color: #ff3333;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin:0; font-size: 24px;">Physics Driving Simulator</h1>
    <p style="margin:5px 0 0 0;"><b>W</b> = Throttle | <b>S</b> = Brake | <b>A / D</b> = Steer</p>
    <p style="margin:2px 0 0 0;"><b>Shift + Up/Down</b> = Gear Shift | <b>Left/Right Arrows</b> = Turn Signals</p>
    <div id="speedometer">0 MPH</div>
    <div id="gear-display">GEAR: 1</div>
    <div id="signals-display">SIGNAL: OFF</div>
    <div id="warning">MONEY SHIFT! SPINOUT!</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // --- Floor / Environment ---
    const grassGeo = new THREE.PlaneGeometry(3000, 3000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = 0;
    scene.add(grass);

    // --- Road Generator ---
    const ROAD_WIDTH = 18;
    const NUM_POINTS = 300;
    const pathPoints = [];

    const radiusX = 600 + Math.random() * 300;
    const radiusZ = 600 + Math.random() * 300;

    for (let i = 0; i < NUM_POINTS; i++) {
      const angle = (i / NUM_POINTS) * Math.PI * 2;
      const wave = Math.sin(angle * 5) * 40 + Math.cos(angle * 3) * 30;
      const x = Math.cos(angle) * (radiusX + wave);
      const z = Math.sin(angle) * (radiusZ + wave);
      pathPoints.push(new THREE.Vector3(x, 0, z));
    }

    const roadCurve = new THREE.CatmullRomCurve3(pathPoints, true);
    const curvePoints = roadCurve.getSpacedPoints(1200);

    const roadVertices = [];
    const roadIndices = [];

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const leftPt = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2);
      const rightPt = pt.clone().addScaledVector(normal, -ROAD_WIDTH / 2);

      roadVertices.push(leftPt.x, 0.01, leftPt.z);
      roadVertices.push(rightPt.x, 0.01, rightPt.z);

      if (i < curvePoints.length - 1) {
        const base = i * 2;
        roadIndices.push(base, base + 1, base + 2);
        roadIndices.push(base + 1, base + 3, base + 2);
      }
    }
    const lastBase = (curvePoints.length - 1) * 2;
    roadIndices.push(lastBase, lastBase + 1, 0);
    roadIndices.push(lastBase + 1, 1, 0);

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222225, side: THREE.DoubleSide });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    scene.add(roadMesh);

    // Road Markings & Props
    const lineMatYellow = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
    const lineMatWhite = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });

    const dashGeo = new THREE.PlaneGeometry(0.35, 3);
    dashGeo.rotateX(-Math.PI / 2);
    const edgeGeo = new THREE.PlaneGeometry(0.35, 3.5);
    edgeGeo.rotateX(-Math.PI / 2);

    for (let i = 0; i < curvePoints.length; i++) {
      const pt = curvePoints[i];
      const nextPt = curvePoints[(i + 1) % curvePoints.length];
      const tangent = roadCurve.getTangentAt(i / curvePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      if (i % 3 === 0) {
        const centerDash = new THREE.Mesh(dashGeo, lineMatYellow);
        centerDash.position.set(pt.x, 0.02, pt.z);
        centerDash.lookAt(nextPt.x, 0.02, nextPt.z);
        scene.add(centerDash);
      }

      const leftPos = pt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      const leftNext = nextPt.clone().addScaledVector(normal, ROAD_WIDTH / 2 - 0.6);
      const leftEdge = new THREE.Mesh(edgeGeo, lineMatWhite);
      leftEdge.position.set(leftPos.x, 0.02, leftPos.z);
      leftEdge.lookAt(leftNext.x, 0.02, leftNext.z);
      scene.add(leftEdge);

      const rightPos = pt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      const rightNext = nextPt.clone().addScaledVector(normal, -(ROAD_WIDTH / 2 - 0.6));
      const rightEdge = new THREE.Mesh(edgeGeo, lineMatWhite);
      rightEdge.position.set(rightPos.x, 0.02, rightPos.z);
      rightEdge.lookAt(rightNext.x, 0.02, rightNext.z);
      scene.add(rightEdge);
    }

    // --- Advanced Particle Engine (Sparks, Fire, Smoke, Shrapnel) ---
    const MAX_PARTICLES = 600;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(MAX_PARTICLES * 3);
    const particleCol = new Float32Array(MAX_PARTICLES * 3);
    const particleData = [];

    for (let i = 0; i < MAX_PARTICLES; i++) {
      particlePos[i * 3 + 1] = -500;
      particleData.push({ vel: new THREE.Vector3(), life: 0, maxLife: 1, type: 'spark' });
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleCol, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.45,
      vertexColors: true,
      transparent: true,
      opacity: 0.95
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    function spawnParticles(pos, count, type) {
      const positions = particleSystem.geometry.attributes.position.array;
      const colors = particleSystem.geometry.attributes.color.array;

      for (let i = 0; i < count; i++) {
        const idx = Math.floor(Math.random() * MAX_PARTICLES);
        positions[idx * 3] = pos.x + (Math.random() - 0.5) * 0.5;
        positions[idx * 3 + 1] = pos.y + (Math.random() - 0.5) * 0.5;
        positions[idx * 3 + 2] = pos.z + (Math.random() - 0.5) * 0.5;

        const p = particleData[idx];
        p.type = type;

        if (type === 'spark') {
          p.vel.set((Math.random() - 0.5) * 1.5, Math.random() * 1.2 + 0.3, (Math.random() - 0.5) * 1.5);
          p.life = 0;
          p.maxLife = 20 + Math.random() * 15;
          colors[idx * 3] = 1.0; colors[idx * 3 + 1] = 0.8; colors[idx * 3 + 2] = 0.2;
        } else if (type === 'fire') {
          p.vel.set((Math.random() - 0.5) * 0.4, Math.random() * 0.8 + 0.4, (Math.random() - 0.5) * 0.4);
          p.life = 0;
          p.maxLife = 35 + Math.random() * 20;
          colors[idx * 3] = 1.0; colors[idx * 3 + 1] = 0.2 + Math.random() * 0.3; colors[idx * 3 + 2] = 0.0;
        } else if (type === 'explosion') {
          p.vel.set((Math.random() - 0.5) * 3.5, Math.random() * 2.5 + 0.5, (Math.random() - 0.5) * 3.5);
          p.life = 0;
          p.maxLife = 40 + Math.random() * 25;
          colors[idx * 3] = 1.0; colors[idx * 3 + 1] = 0.4; colors[idx * 3 + 2] = 0.0;
        }
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
      particleSystem.geometry.attributes.color.needsUpdate = true;
    }

    function updateParticles() {
      const positions = particleSystem.geometry.attributes.position.array;
      const colors = particleSystem.geometry.attributes.color.array;

      for (let i = 0; i < MAX_PARTICLES; i++) {
        const p = particleData[i];
        if (positions[i * 3 + 1] > -100) {
          p.life++;
          positions[i * 3] += p.vel.x;
          positions[i * 3 + 1] += p.vel.y;
          positions[i * 3 + 2] += p.vel.z;

          if (p.type === 'spark') {
            p.vel.y -= 0.04; // Gravity
            if (positions[i * 3 + 1] <= 0.02) {
              positions[i * 3 + 1] = 0.02;
              p.vel.y = -p.vel.y * 0.3;
            }
          } else if (p.type === 'fire') {
            colors[i * 3] *= 0.96;
            colors[i * 3 + 1] *= 0.92;
          }

          if (p.life >= p.maxLife) {
            positions[i * 3 + 1] = -500;
          }
        }
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
      particleSystem.geometry.attributes.color.needsUpdate = true;
    }

    // --- Modular Vehicle Builder with Detachable Parts ---
    function createModularCar(colorHex) {
      const carGroup = new THREE.Group();
      const bodyGroup = new THREE.Group();
      carGroup.add(bodyGroup);

      const carBodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
      const darkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
      const bumperMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
      const glassMat = new THREE.MeshPhongMaterial({ color: 0x223344, shininess: 80, transparent: true, opacity: 0.85 });
      const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
      const taillightIdleMat = new THREE.MeshBasicMaterial({ color: 0x550000 });
      const brakeLightActiveMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      
      const signalMatLeft = new THREE.MeshBasicMaterial({ color: 0xffaa00, visible: false });
      const signalMatRight = new THREE.MeshBasicMaterial({ color: 0xffaa00, visible: false });

      // Main Chassis Mesh (Deformable)
      const bodyGeo = new THREE.BoxGeometry(2, 0.7, 4, 4, 2, 6);
      const chassis = new THREE.Mesh(bodyGeo, carBodyMat);
      chassis.position.y = 0.55;
      bodyGroup.add(chassis);

      // Glass Cabin
      const cabinGeo = new THREE.BoxGeometry(1.65, 0.6, 2.1, 2, 2, 2);
      const cabin = new THREE.Mesh(cabinGeo, glassMat);
      cabin.position.set(0, 1.15, -0.1);
      bodyGroup.add(cabin);

      // Detachable Modular Components
      const detachableParts = [];

      function createDetachablePart(geo, mat, pos, name) {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        bodyGroup.add(mesh);
        detachableParts.push({ mesh: mesh, localPos: pos.clone(), attached: true, name: name });
        return mesh;
      }

      // Hood
      const hoodGeo = new THREE.BoxGeometry(1.7, 0.08, 1.3);
      createDetachablePart(hoodGeo, carBodyMat, new THREE.Vector3(0, 0.92, -1.25), 'hood');

      // Bumpers
      const frontBumper = createDetachablePart(new THREE.BoxGeometry(2.1, 0.3, 0.25), bumperMat, new THREE.Vector3(0, 0.35, -2.05), 'bumper_F');
      const rearBumper = createDetachablePart(new THREE.BoxGeometry(2.1, 0.3, 0.25), bumperMat, new THREE.Vector3(0, 0.35, 2.05), 'bumper_R');

      // Headlights & Taillights
      const headlightGeo = new THREE.BoxGeometry(0.4, 0.18, 0.08);
      createDetachablePart(headlightGeo, headlightMat, new THREE.Vector3(-0.65, 0.65, -2.02), 'headlight_L');
      createDetachablePart(headlightGeo, headlightMat, new THREE.Vector3(0.65, 0.65, -2.02), 'headlight_R');

      const taillightGeo = new THREE.BoxGeometry(0.4, 0.18, 0.08);
      const taillightL = createDetachablePart(taillightGeo, taillightIdleMat, new THREE.Vector3(-0.65, 0.65, 2.02), 'taillight_L');
      const taillightR = createDetachablePart(taillightGeo, taillightIdleMat, new THREE.Vector3(0.65, 0.65, 2.02), 'taillight_R');

      // Signals
      const signalGeo = new THREE.BoxGeometry(0.2, 0.15, 0.1);
      createDetachablePart(signalGeo, signalMatLeft, new THREE.Vector3(-0.92, 0.65, -2.02), 'sig_FL');
      createDetachablePart(signalGeo, signalMatLeft, new THREE.Vector3(-0.92, 0.65, 2.02), 'sig_RL');
      createDetachablePart(signalGeo, signalMatRight, new THREE.Vector3(0.92, 0.65, -2.02), 'sig_FR');
      createDetachablePart(signalGeo, signalMatRight, new THREE.Vector3(0.92, 0.65, 2.02), 'sig_RR');

      // Wheels Assemblies
      const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
      wheelGeo.rotateZ(Math.PI / 2);
      const rimGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.32, 12);
      rimGeo.rotateZ(Math.PI / 2);
      const rimMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });

      function buildWheel() {
        const pivot = new THREE.Group();
        pivot.add(new THREE.Mesh(wheelGeo, darkMat));
        pivot.add(new THREE.Mesh(rimGeo, rimMat));
        return pivot;
      }

      const frontPivots = [];
      const wheelPositions = [
        { pos: new THREE.Vector3(-1.05, 0.4, -1.2), isFront: true, name: 'wheel_FL' },
        { pos: new THREE.Vector3(1.05, 0.4, -1.2), isFront: true, name: 'wheel_FR' },
        { pos: new THREE.Vector3(-1.05, 0.4, 1.2), isFront: false, name: 'wheel_RL' },
        { pos: new THREE.Vector3(1.05, 0.4, 1.2), isFront: false, name: 'wheel_RR' }
      ];

      wheelPositions.forEach(w => {
        const pivot = buildWheel();
        pivot.position.copy(w.pos);
        bodyGroup.add(pivot);
        if (w.isFront) frontPivots.push(pivot);
        detachableParts.push({ mesh: pivot, localPos: w.pos.clone(), attached: true, name: w.name });
      });

      return {
        root: carGroup,
        bodyGroup: bodyGroup,
        chassis: chassis,
        cabin: cabin,
        frontPivots: frontPivots,
        detachableParts: detachableParts,
        brakeLights: [taillightL, taillightR],
        idleMat: taillightIdleMat,
        activeMat: brakeLightActiveMat,
        signalMatLeft: signalMatLeft,
        signalMatRight: signalMatRight
      };
    }

    // --- Detached Debris Manager ---
    const activeDebris = [];

    function detachPart(carObj, part, impactForce) {
      if (!part.attached) return;
      part.attached = false;

      // Unparent from car, add directly to scene physics
      carObj.meshData.bodyGroup.remove(part.mesh);
      scene.add(part.mesh);

      // Align matrix to world space
      part.mesh.position.copy(carObj.meshData.bodyGroup.localToWorld(part.localPos.clone()));
      part.mesh.quaternion.copy(carObj.mesh.quaternion);

      // Inherit velocity plus impact shrapnel scatter
      const scatterVel = new THREE.Vector3(
        (Math.random() - 0.5) * impactForce * 1.5,
        Math.random() * impactForce * 0.8 + 0.2,
        (Math.random() - 0.5) * impactForce * 1.5
      );

      activeDebris.push({
        mesh: part.mesh,
        velocity: carObj.velocity.clone().add(scatterVel),
        angularVel: new THREE.Vector3(Math.random() * 0.3, Math.random() * 0.3, Math.random() * 0.3)
      });
    }

    function updateDebris() {
      for (let i = activeDebris.length - 1; i >= 0; i--) {
        const d = activeDebris[i];
        d.mesh.position.add(d.velocity);
        d.mesh.rotation.x += d.angularVel.x;
        d.mesh.rotation.y += d.angularVel.y;
        d.mesh.rotation.z += d.angularVel.z;

        // Ground check
        if (d.mesh.position.y <= 0.1) {
          d.mesh.position.y = 0.1;
          d.velocity.set(0, 0, 0);
          d.angularVel.set(0, 0, 0);
        } else {
          d.velocity.y -= 0.015; // Gravity
        }
      }
    }

    // --- Entity Creation ---
    function createPhysicsVehicle(colorHex, isPlayer = false) {
      const meshData = createModularCar(colorHex);
      return {
        meshData: meshData,
        mesh: meshData.root,
        velocity: new THREE.Vector3(),
        angularVelocity: new THREE.Vector3(),
        isAirborne: false,
        isPlayer: isPlayer,
        width: 2.1,
        height: 1.4,
        length: 4.2,
        health: 100,
        onFire: false,
        exploded: false,
        fireTimer: 0
      };
    }

    const playerVehicle = createPhysicsVehicle(0xcc0000, true);
    scene.add(playerVehicle.mesh);

    const startPos = roadCurve.getPointAt(0);
    const startTangent = roadCurve.getTangentAt(0);
    playerVehicle.mesh.position.copy(startPos);
    playerVehicle.mesh.lookAt(startPos.clone().add(startTangent));

    // Traffic Setup
    const aiCars = [];
    const trafficColors = [0x0055ff, 0xffaa00, 0x888888, 0x00aa44, 0x9900cc];
    const NUM_AI_CARS = 16;

    for (let i = 0; i < NUM_AI_CARS; i++) {
      const ai = createPhysicsVehicle(trafficColors[i % trafficColors.length]);
      scene.add(ai.mesh);

      const progress = (i / NUM_AI_CARS);
      const laneSide = i % 2 === 0 ? 1 : -1;
      const laneOffset = (ROAD_WIDTH / 4) * laneSide;
      const baseSpeed = (0.0004 + Math.random() * 0.0003) * 0.2;

      aiCars.push({
        ...ai,
        progress: progress,
        targetSpeed: baseSpeed,
        currentSpeed: baseSpeed,
        laneOffset: laneOffset,
        direction: laneSide,
        isBraking: false,
        inCrashPhysics: false
      });
    }

    // --- Transmission & Input Handling ---
    const gearList = ['R', 'N', '1', '2', '3', '4', '5', '6', '7'];
    let currentGearIndex = 2;

    const gearRatios = {
      'R': { accel: -0.0030, maxSpeed: -0.40, isReverse: true },
      'N': { accel: 0, maxSpeed: 0, isNeutral: true },
      '1': { accel: 0.0065, maxSpeed: 0.35 },
      '2': { accel: 0.0050, maxSpeed: 0.60 },
      '3': { accel: 0.0038, maxSpeed: 0.90 },
      '4': { accel: 0.0028, maxSpeed: 1.20 },
      '5': { accel: 0.0020, maxSpeed: 1.50 },
      '6': { accel: 0.0014, maxSpeed: 1.75 },
      '7': { accel: 0.0009, maxSpeed: 2.00 }
    };

    let speed = 0;
    let currentSteerAngle = 0;
    let isSpinningOut = false;
    let spinoutTimer = 0;

    let activeSignal = 'OFF';
    let signalTimer = 0;

    const BRAKE_POWER = 0.035;
    const FRICTION = 0.993;
    const keys = { w: false, s: false, a: false, d: false, shift: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 's' || e.key === 'S') keys.s = true;
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
      if (e.key === 'Shift') keys.shift = true;

      if (keys.shift && !isSpinningOut) {
        const oldGear = gearList[currentGearIndex];
        if (e.key === 'ArrowUp') {
          if (currentGearIndex < gearList.length - 1) currentGearIndex++;
        } else if (e.key === 'ArrowDown') {
          if (currentGearIndex > 0) currentGearIndex--;
        }

        const newGear = gearList[currentGearIndex];
        document.getElementById('gear-display').innerText = `GEAR: ${newGear}`;

        if ((oldGear === '6' || oldGear === '7') && (newGear === '1' || newGear === 'R') && Math.abs(speed) > 0.85) {
          isSpinningOut = true;
          spinoutTimer = 120;
          document.getElementById('warning').style.display = 'block';
        }
      }

      if (!keys.shift) {
        if (e.key === 'ArrowLeft') activeSignal = (activeSignal === 'LEFT') ? 'OFF' : 'LEFT';
        if (e.key === 'ArrowRight') activeSignal = (activeSignal === 'RIGHT') ? 'OFF' : 'RIGHT';
        document.getElementById('signals-display').innerText = `SIGNAL: ${activeSignal}`;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 's' || e.key === 'S') keys.s = false;
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      if (e.key === 'Shift') keys.shift = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Mesh Vertex Deformation Engine ---
    function deformMesh(mesh, impactPoint, impactForce) {
      const positions = mesh.geometry.attributes.position;
      const localImpact = mesh.worldToLocal(impactPoint.clone());

      for (let i = 0; i < positions.count; i++) {
        const v = new THREE.Vector3(positions.getX(i), positions.getY(i), positions.getZ(i));
        const dist = v.distanceTo(localImpact);

        if (dist < 1.8) {
          const deformFactor = (1.8 - dist) * impactForce * 0.25;
          const pushDir = v.clone().sub(localImpact).normalize();
          v.addScaledVector(pushDir, deformFactor);

          positions.setXYZ(i, v.x, v.y, v.z);
        }
      }
      positions.needsUpdate = true;
      mesh.geometry.computeVertexNormals();
    }

    // --- Explosion Blastwave Mechanics ---
    function triggerEngineExplosion(vehicle) {
      if (vehicle.exploded) return;
      vehicle.exploded = true;
      vehicle.onFire = false;

      const engineWorldPos = vehicle.mesh.localToWorld(new THREE.Vector3(0, 0.6, -1.8));
      spawnParticles(engineWorldPos, 120, 'explosion');

      // Detach front components instantly
      vehicle.meshData.detachableParts.forEach(part => {
        if (part.name.includes('hood') || part.name.includes('bumper_F') || part.name.includes('wheel_F')) {
          detachPart(vehicle, part, 2.5);
        }
      });

      // Blastwave impulse to nearby cars
      const allVehicles = [playerVehicle, ...aiCars];
      allVehicles.forEach(target => {
        const dist = target.mesh.position.distanceTo(engineWorldPos);
        if (dist < 12 && dist > 0.1) {
          const blastForce = (12 - dist) * 0.12;
          const blastDir = target.mesh.position.clone().sub(engineWorldPos).normalize();

          target.velocity.addScaledVector(blastDir, blastForce);
          target.velocity.y += blastForce * 0.5; // Slight vertical toss
          target.angularVelocity.add(new THREE.Vector3((Math.random() - 0.5) * blastForce, (Math.random() - 0.5) * blastForce, (Math.random() - 0.5) * blastForce));

          if (target.isPlayer) {
            speed *= 0.2;
            isSpinningOut = true;
            spinoutTimer = 60;
          } else {
            target.inCrashPhysics = true;
          }
        }
      });
    }

    // --- Sub-stepped Rigid Body Physics and Floor Hitbox Engine ---
    function stepVehiclePhysics(v) {
      // Apply linear velocity
      v.mesh.position.add(v.velocity);

      // Apply Rotations
      v.mesh.rotation.x += v.angularVelocity.x;
      v.mesh.rotation.y += v.angularVelocity.y;
      v.mesh.rotation.z += v.angularVelocity.z;

      // Floor Hitbox & Raycasting Constraint
      if (v.mesh.position.y <= 0) {
        v.mesh.position.y = 0; // Hard clamp ground plane
        v.velocity.y = 0;
        v.isAirborne = false;

        // Friction dampening
        v.velocity.x *= 0.92;
        v.velocity.z *= 0.92;

        // Restabilize rotations when grounded
        v.angularVelocity.multiplyScalar(0.85);
        v.mesh.rotation.x *= 0.8;
        v.mesh.rotation.z *= 0.8;
      } else {
        v.velocity.y -= 0.003; // Smooth sub-stepped gravity
        v.isAirborne = true;
        // Suppress infinite flying up
        v.velocity.y = Math.min(v.velocity.y, 0.4);
      }

      // Handle Engine Fire Logic
      if (v.onFire && !v.exploded) {
        v.fireTimer++;
        const enginePos = v.mesh.localToWorld(new THREE.Vector3(0, 0.6, -1.8));
        spawnParticles(enginePos, 3, 'fire');

        if (v.fireTimer > 90 + Math.random() * 60) {
          triggerEngineExplosion(v);
        }
      }
    }

    // --- Exact OBB Overlap Collision Solver ---
    function checkOBBCollision(v1, v2) {
      const p1 = v1.mesh.position;
      const p2 = v2.mesh.position;
      const dx = p1.x - p2.x;
      const dz = p1.z - p2.z;
      const distSq = dx * dx + dz * dz;

      // Quick bounding check
      if (distSq > 25) return null;

      // Detailed collision check
      const normal = new THREE.Vector3(dx, 0, dz).normalize();
      const overlap = (v1.width + v2.width) * 0.95 - Math.sqrt(distSq);

      if (overlap > 0) {
        return { normal: normal, overlap: overlap };
      }
      return null;
    }

    function resolveCollisions() {
      const allVehicles = [playerVehicle, ...aiCars];

      for (let i = 0; i < allVehicles.length; i++) {
        for (let j = i + 1; j < allVehicles.length; j++) {
          const v1 = allVehicles[i];
          const v2 = allVehicles[j];

          const col = checkOBBCollision(v1, v2);
          if (col) {
            // Positional separation
            v1.mesh.position.addScaledVector(col.normal, col.overlap * 0.5);
            v2.mesh.position.addScaledVector(col.normal, -col.overlap * 0.5);

            // Compute relative impact velocity
            const v1Vel = v1.isPlayer ? new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), v1.mesh.rotation.y).multiplyScalar(speed) : v1.velocity;
            const v2Vel = v2.isPlayer ? new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), v2.mesh.rotation.y).multiplyScalar(speed) : v2.velocity;

            const relVel = v1Vel.clone().sub(v2Vel);
            const impactForce = relVel.length();
            const impactPoint = v1.mesh.position.clone().add(v2.mesh.position).multiplyScalar(0.5);

            // Tiered Collision Responses
            if (impactForce < 0.12) {
              // Minor scratch
              spawnParticles(impactPoint, 4, 'spark');
            } else {
              // Heavy impact: Deform meshes and break parts
              spawnParticles(impactPoint, 30, 'spark');

              deformMesh(v1.meshData.chassis, impactPoint, impactForce);
              deformMesh(v2.meshData.chassis, impactPoint, impactForce);

              // Detach components based on impact intensity
              v1.meshData.detachableParts.forEach(part => { if (Math.random() < impactForce * 0.8) detachPart(v1, part, impactForce); });
              v2.meshData.detachableParts.forEach(part => { if (Math.random() < impactForce * 0.8) detachPart(v2, part, impactForce); });

              // Physics Impulse Exchange
              const impulse = col.normal.clone().multiplyScalar(impactForce * 0.4);
              v1.velocity.add(impulse);
              v2.velocity.sub(impulse);

              v1.angularVelocity.y += (Math.random() - 0.5) * impactForce * 0.3;
              v2.angularVelocity.y += (Math.random() - 0.5) * impactForce * 0.3;

              // Check for Head-On Engine Angle Ignition
              const v1EnginePos = v1.mesh.localToWorld(new THREE.Vector3(0, 0.5, -1.8));
              const v2EnginePos = v2.mesh.localToWorld(new THREE.Vector3(0, 0.5, -1.8));

              if (impactPoint.distanceTo(v1EnginePos) < 1.6 && impactForce > 0.4) v1.onFire = true;
              if (impactPoint.distanceTo(v2EnginePos) < 1.6 && impactForce > 0.4) v2.onFire = true;

              if (v1.isPlayer) {
                speed *= 0.25;
                isSpinningOut = true;
                spinoutTimer = 40;
              } else v1.inCrashPhysics = true;

              if (v2.isPlayer) {
                speed *= 0.25;
                isSpinningOut = true;
                spinoutTimer = 40;
              } else v2.inCrashPhysics = true;
            }
          }
        }
      }
    }

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // 1. Inputs & Drive Controls
      const currentGearKey = gearList[currentGearIndex];
      const activeGear = gearRatios[currentGearKey];
      let playerIsBraking = false;

      if (isSpinningOut) {
        speed *= 0.96;
        spinoutTimer--;
        if (spinoutTimer <= 0) {
          isSpinningOut = false;
          document.getElementById('warning').style.display = 'none';
        }
      } else {
        if (keys.w && !activeGear.isNeutral) {
          speed = activeGear.isReverse ? Math.max(speed + activeGear.accel, activeGear.maxSpeed) : Math.min(speed + activeGear.accel, activeGear.maxSpeed);
        } else {
          speed *= FRICTION;
        }

        if (keys.s) {
          playerIsBraking = true;
          if (speed > 0) speed = Math.max(0, speed - BRAKE_POWER);
          else if (speed < 0) speed = Math.min(0, speed + BRAKE_POWER);
        }

        const absSpeed = Math.abs(speed);
        const steerLimit = 0.065 * (1.0 - Math.min(absSpeed / 2.0, 1.0) * 0.82);

        if (keys.a) currentSteerAngle = Math.min(currentSteerAngle + 0.001, steerLimit);
        else if (keys.d) currentSteerAngle = Math.max(currentSteerAngle - 0.001, -steerLimit);
        else currentSteerAngle += (0 - currentSteerAngle) * 0.1;

        if (Math.abs(speed) > 0.002 && !playerVehicle.isAirborne) {
          playerVehicle.mesh.rotation.y += currentSteerAngle * (speed >= 0 ? 1 : -1);
        }
      }

      if (!playerVehicle.isAirborne) {
        const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerVehicle.mesh.rotation.y);
        playerVehicle.mesh.position.addScaledVector(fwd, speed);
      }

      // 2. Sub-stepped Physics execution for maximum stability
      const SUB_STEPS = 5;
      for (let s = 0; s < SUB_STEPS; s++) {
        stepVehiclePhysics(playerVehicle);

        aiCars.forEach(ai => {
          if (!ai.inCrashPhysics) {
            ai.progress += ai.currentSpeed * ai.direction;
            if (ai.progress > 1) ai.progress -= 1;
            if (ai.progress < 0) ai.progress += 1;

            const pos = roadCurve.getPointAt(ai.progress);
            const tangent = roadCurve.getTangentAt(ai.progress);
            const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

            ai.mesh.position.copy(pos).addScaledVector(normal, ai.laneOffset);
            ai.mesh.lookAt(pos.clone().addScaledVector(tangent, ai.direction).addScaledVector(normal, ai.laneOffset));
          } else {
            stepVehiclePhysics(ai);
          }
        });

        resolveCollisions();
      }

      // 3. Update Visuals, Particles, and Camera
      updateParticles();
      updateDebris();

      const brakeMat = playerIsBraking ? playerVehicle.meshData.activeMat : playerVehicle.meshData.idleMat;
      playerVehicle.meshData.brakeLights.forEach(light => { if (light.mesh) light.mesh.material = brakeMat; });

      signalTimer += 0.08;
      const isBlinking = Math.sin(signalTimer * 8) > 0;
      playerVehicle.meshData.signalMatLeft.visible = (activeSignal === 'LEFT') && isBlinking;
      playerVehicle.meshData.signalMatRight.visible = (activeSignal === 'RIGHT') && isBlinking;

      playerVehicle.meshData.frontPivots.forEach(p => p.rotation.y = currentSteerAngle * 9);

      grass.position.x = playerVehicle.mesh.position.x;
      grass.position.z = playerVehicle.mesh.position.z;

      const camOffset = new THREE.Vector3(0, 3.5, 8).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerVehicle.mesh.rotation.y);
      camera.position.copy(playerVehicle.mesh.position).add(camOffset);
      camera.lookAt(playerVehicle.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

      document.getElementById('speedometer').innerText = `${Math.round(Math.abs(speed) * 80)} MPH`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
