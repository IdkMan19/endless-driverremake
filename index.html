<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Driving Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0b0b1a;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #speedometer {
      font-size: 20px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1 style="margin:0; font-size: 24px;">Physics Simulator Drive</h1>
    <p style="margin:5px 0 0 0;"><b>W / Up</b> = Accelerate | <b>S / Down</b> = Reverse/Brake</p>
    <p style="margin:2px 0 0 0;"><b>A / D</b> or <b>Left / Right</b> = Steer</p>
    <div id="speedometer">0 MPH</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Daylight sky color
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // --- Infinite Ground Terrain (Grass) ---
    const grassGeo = new THREE.PlaneGeometry(3000, 3000);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -0.05;
    scene.add(grass);

    // --- Curving Road with Lane Lines ---
    const ROAD_WIDTH = 14;
    const pathPoints = [];
    
    // Generate a long winding road path in 3D space
    let rX = 0, rZ = 0;
    for (let i = 0; i < 200; i++) {
      pathPoints.push(new THREE.Vector3(rX, 0, rZ));
      rZ -= 30;
      rX += Math.sin(i * 0.2) * 20; // Smooth curve geometry
    }

    const roadCurve = new THREE.CatmullRomCurve3(pathPoints);

    // Create Road Asphalt Ribbon
    const roadGeo = new THREE.TubeGeometry(roadCurve, 600, ROAD_WIDTH / 2, 2, false);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x333338, side: THREE.DoubleSide });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.scale.set(1, 0.01, 1); // Flatten tube into flat ribbon
    scene.add(roadMesh);

    // Create Yellow Center Lane Markings
    const lanePoints = roadCurve.getSpacedPoints(300);
    const laneGeo = new THREE.BoxGeometry(0.4, 0.05, 2);
    const laneMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

    for (let i = 0; i < lanePoints.length - 1; i += 2) {
      const laneMark = new THREE.Mesh(laneGeo, laneMat);
      laneMark.position.copy(lanePoints[i]);
      laneMark.position.y = 0.02;
      
      // Orient dash toward next road segment
      laneMark.lookAt(lanePoints[i + 1]);
      scene.add(laneMark);
    }

    // Add Trees on both sides of the road
    const treeGeo = new THREE.ConeGeometry(2, 6, 5);
    const treeMat = new THREE.MeshLambertMaterial({ color: 0x1b5e20 });

    for (let i = 5; i < lanePoints.length; i += 3) {
      const pt = lanePoints[i];
      const tangent = roadCurve.getTangentAt(i / lanePoints.length);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      // Left Tree
      const treeL = new THREE.Mesh(treeGeo, treeMat);
      treeL.position.copy(pt).addScaledVector(normal, ROAD_WIDTH / 2 + 5 + Math.random() * 10);
      treeL.position.y = 3;
      scene.add(treeL);

      // Right Tree
      const treeR = new THREE.Mesh(treeGeo, treeMat);
      treeR.position.copy(pt).addScaledVector(normal, -(ROAD_WIDTH / 2 + 5 + Math.random() * 10));
      treeR.position.y = 3;
      scene.add(treeR);
    }

    // --- Player Car Mesh ---
    const carGroup = new THREE.Group();

    // Body
    const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4), carBodyMat);
    carBody.position.y = 0.5;
    carGroup.add(carBody);

    // Cabin
    const cabinMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), cabinMat);
    cabin.position.set(0, 1.2, -0.2);
    carGroup.add(cabin);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    wheelGeo.rotateZ(Math.PI / 2);

    const wheelPositions = [
      [-1.1, 0.4, 1.2],  // Rear Left
      [1.1, 0.4, 1.2],   // Rear Right
      [-1.1, 0.4, -1.2], // Front Left
      [1.1, 0.4, -1.2]   // Front Right
    ];

    wheelPositions.forEach((pos) => {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.position.set(...pos);
      carGroup.add(wheel);
    });

    scene.add(carGroup);
    carGroup.position.set(0, 0, 0);

    // --- Car Physics State ---
    let speed = 0;
    let steeringAngle = 0;
    
    // Adjusted Tuning Parameters
    const ACCEL = 0.007;          // Slower acceleration (was 0.015)
    const BRAKE = 0.025;          // Sensitive brakes
    const REVERSE_ACCEL = 0.005;  // Reverse speed buildup
    const FRICTION = 0.985;       // Natural coasting drag
    const MAX_SPEED = 1.0;
    const MAX_REVERSE = -0.3;
    const STEER_SPEED = 0.015;    // Less sensitive steering (was 0.03)

    // Control Inputs
    const keys = { forward: false, backward: false, left: false, right: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // 1. Acceleration, Sensitive Braking, and Reverse Logic
      if (keys.forward) {
        if (speed < 0) {
          speed = Math.min(0, speed + BRAKE); // Apply strong braking when moving backward
        } else {
          speed = Math.min(speed + ACCEL, MAX_SPEED); // Gradual forward acceleration
        }
      } else if (keys.backward) {
        if (speed > 0) {
          speed = Math.max(0, speed - BRAKE); // Apply strong braking when moving forward
        } else {
          speed = Math.max(speed - REVERSE_ACCEL, MAX_REVERSE); // Reverse acceleration
        }
      } else {
        speed *= FRICTION; // Natural coasting slowdown
      }

      // Stop tiny decimal movement drift
      if (Math.abs(speed) < 0.0005) speed = 0;

      // 2. Smoother, Less Sensitive Steering Physics
      if (keys.left) {
        steeringAngle = Math.min(steeringAngle + STEER_SPEED, 0.025);
      } else if (keys.right) {
        steeringAngle = Math.max(steeringAngle - STEER_SPEED, -0.025);
      } else {
        steeringAngle *= 0.75; // Auto-center wheel when keys released
      }

      // Steering angle applies relative to current movement direction
      if (Math.abs(speed) > 0.002) {
        const turnDirection = speed >= 0 ? 1 : -1;
        carGroup.rotation.y += steeringAngle * turnDirection * (Math.abs(speed) / MAX_SPEED);
      }

      // 3. Position Updates
      const forwardVector = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      carGroup.position.addScaledVector(forwardVector, speed);

      // 4. Infinite Grass Following Logic
      grass.position.x = carGroup.position.x;
      grass.position.z = carGroup.position.z;

      // 5. 3rd-Person Follow Camera
      const cameraOffset = new THREE.Vector3(0, 3.5, 8).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      camera.position.copy(carGroup.position).add(cameraOffset);
      
      const lookAtTarget = carGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      camera.lookAt(lookAtTarget);

      // 6. UI Speedometer
      const mph = Math.round(Math.abs(speed) * 80);
      document.getElementById('speedometer').innerText = `${mph} MPH`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
